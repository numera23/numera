<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beranda | Cakrawala Matematika</title>

<style>
.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.brand-mark{
    width:28px;
    height:28px;
    border-radius:8px;
    background:#2563EB;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:0 4px 10px rgba(37,99,235,0.28);
}

.brand-name{
    font-weight:800;
    font-size:15px;
    line-height:1;
    letter-spacing:-0.01em;
}
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #2563EB;
        --bg: #F8FAFC;
        --card: #FFFFFF;
        --border: #E5E7EB;
        --text: #0F172A;
        --text-secondary: #64748B;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
    }

    a { text-decoration: none; color: inherit; }

    .app-shell {
        max-width: 440px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
        position: relative;
    }

    @media (min-width: 441px) {
        .app-shell {
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
    }

    .container {
        padding: 0 20px 40px;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
    }

    .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px 2px;
    }
    .app-header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    }

    .icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        color: var(--text-secondary);
        background: transparent;
        border: none;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
        background: var(--card);
        color: var(--primary);
    }

    .icon-btn svg { width: 20px; height: 20px; }

    .hero {
        position: relative;
        margin: 8px 0 22px;
        padding: 18px 20px;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(155deg, #EFF4FF 0%, #F8FAFC 65%);
        border: 1px solid var(--border);
        animation: fadeInUp 0.5s ease both;
    }

    .hero-visual {
        position: absolute;
        right: -18px;
        top: 50%;
        transform: translateY(-50%);
        width: 42%;
        max-width: 170px;
        opacity: 0.55;
        pointer-events: none;
    }

    .hero-text {
        position: relative;
        z-index: 1;
        max-width: 72%;
    }

    .hero-text h2 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.3;
        color: var(--text);
        margin-bottom: 8px;
    }

    .hero-tagline {
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
        letter-spacing: -0.01em;
    }

    .section {
        margin-bottom: 26px;
        animation: fadeInUp 0.5s ease both;
    }

    .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .section-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--text);
        text-transform: uppercase;
    }

    .section-title svg {
        width: 16px;
        height: 16px;
        color: var(--primary);
    }

    .section-link {
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
        white-space: nowrap;
    }

    .section-link svg {
        width: 14px;
        height: 14px;
        transition: transform 0.15s ease;
    }

    .section-link:hover svg { transform: translateX(3px); }

    .announce-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .announce-card {
        display: flex;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .announce-icon {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .announce-icon svg { width: 20px; height: 20px; }

    .announce-icon.red  { background: #FEF2F2; color: #DC2626; }
    .announce-icon.blue { background: #EFF6FF; color: #2563EB; }
    .announce-icon.green{ background: #F0FDF4; color: #16A34A; }

    .announce-body { flex: 1; min-width: 0; }

    .announce-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 2px;
    }

    .announce-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
    }

    .announce-label.red  { color: #DC2626; }
    .announce-label.blue { color: #2563EB; }
    .announce-label.green{ color: #16A34A; }

    .announce-date {
        flex-shrink: 0;
        font-size: 11.5px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
    }

    .announce-date::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
    }

    .announce-date.red  { color: #DC2626; }
    .announce-date.blue { color: #2563EB; }
    .announce-date.green{ color: #16A34A; }

    .announce-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        margin: 2px 0 3px;
        letter-spacing: -0.01em;
    }

    .announce-desc {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.45;
    }

    .announce-cta {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
    }

    .announce-cta svg { width: 13px; height: 13px; }

    .recommend-card {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #EFF6FF;
        border: 1px solid #DBEAFE;
        border-radius: 16px;
        padding: 14px 16px;
    }

    .recommend-icon {
        flex-shrink: 0;
        width: 46px;
        height: 46px;
        border-radius: 13px;
        background: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
    }

    .recommend-icon svg { width: 22px; height: 22px; }

    .recommend-body { flex: 1; min-width: 0; }

    .recommend-tag {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--primary);
        margin-bottom: 2px;
    }

    .recommend-title {
        font-size: 15.5px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
    }

    .recommend-reason {
        margin-top: 3px;
        font-size: 12.5px;
        color: var(--text-secondary);
        line-height: 1.4;
    }

    .recommend-arrow {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .recommend-arrow svg { width: 17px; height: 17px; }

    .bottom-nav-spacer {
        height: calc(72px + env(safe-area-inset-bottom));
    }

    .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0 auto;
        width: 100%;
        max-width: 440px;
        display: flex;
        z-index: 50;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border);
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 2px;
        color: var(--text-secondary);
        border-radius: 12px;
        text-decoration: none;
        transition: color 0.15s ease;
    }

    .nav-item svg {
        width: 22px;
        height: 22px;
    }

    .nav-item span {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
    }

    .nav-item.active {
        color: var(--primary);
    }

    .nav-item:active {
        opacity: 0.7;
    }
</style>
</head>
<body>

<div class="app-shell">

                <circle cx="45" cy="130" r="3" fill="#2563EB" opacity="0.3"/>

        <div class="section" id="sectionPengumuman">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 0 0 2 2h1l3.5 4.5V4.5L6 9H5a2 2 0 0 0-2 2Z"/><path d="M14 8a4 4 0 0 1 0 8"/><path d="M17.5 5.5a8 8 0 0 1 0 13"/></svg>

<script>
    const PENGUMUMAN = [
        {
            tipe: "ulangan",
            label: "Ulangan Harian",
            judul: "XI John Dalton",
            deskripsi: "Polinomial \u00B7 Jangan lupa belajar & siapkan contekan satu lembar.",
            tanggal: "27 Ags 2026",
            link: null,
            cta: null
        },
        {
            tipe: "materi",
            label: "Materi",
            judul: "PGS Lingkaran Jika Gradien Diketahui",
            deskripsi: "Materi untuk XII Maxwell & XII Nobel",
            tanggal: "28 Ags 2026",
            link: "persamaan_lingkaran_pgs.html",
            cta: "Buka modul"
        },
        {
            tipe: "deadline",
            label: "Deadline",
            judul: "Pengumpulan Latihan 1",
            deskripsi: "Paling lambat Jumat, 9 Agustus 2026.",
            tanggal: "9 Ags 2026",
            link: null,
            cta: null
        }
    ];

    const ICON_TIPE = {
        ulangan: {
            warna: "red",
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><circle cx="8" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>'
        },
        materi: {
            warna: "blue",
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg>'
        },
        deadline: {
            warna: "green",
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>'
        }
    };

    function buatCardPengumuman(item) {
        const info = ICON_TIPE[item.tipe] || ICON_TIPE.materi;
        const warna = info.warna;
        const tag = item.link ? "a" : "div";
        const card = document.createElement(tag);
        card.className = "announce-card";
        if (item.link) card.href = item.link;

        const ctaHTML = item.cta
            ? `<span class="announce-cta">${item.cta}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
               </span>`
            : "";

        card.innerHTML = `
            <div class="announce-icon ${warna}">${info.svg}</div>
            <div class="announce-body">
                <div class="announce-top">
                    <span class="announce-label ${warna}">${item.label}</span>
                    <span class="announce-date ${warna}">${item.tanggal}</span>
                </div>
                <div class="announce-title">${item.judul}</div>
                <div class="announce-desc">${item.deskripsi}</div>
                ${ctaHTML}
            </div>
        `;
        return card;
    }

    function renderPengumuman() {
        const list = document.getElementById("announceList");
        list.innerHTML = "";
        PENGUMUMAN.slice(0, 3).forEach(item => {
            list.appendChild(buatCardPengumuman(item));
        });
    }

    /* =============================================================
       REKOMENDASI BELAJAR — satu saran langkah berikutnya.
       tipe: "modul" | "eksplorasi" — menentukan label & ikon.
       ============================================================= */
    const REKOMENDASI = {
        tipe: "modul",
        judul: "Teorema Sisa",
        alasan: "Lanjutkan setelah kamu menyelesaikan Metode Horner.",
        link: "teorema_sisa.html"
    };

    const REKOMENDASI_ICON = {
        modul: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg>',
        eksplorasi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5.5L4.5 18a1.8 1.8 0 0 0 1.6 2.6h11.8A1.8 1.8 0 0 0 19.5 18L14 8.5V3"/><path d="M7.5 14h9"/></svg>'
    };

    const REKOMENDASI_LABEL = {
        modul: "Modul",
        eksplorasi: "Eksplorasi"
    };

    function renderRekomendasi() {
        const card = document.getElementById("recommendCard");
        card.href = REKOMENDASI.link;
        card.innerHTML = `
            <div class="recommend-icon">${REKOMENDASI_ICON[REKOMENDASI.tipe]}</div>
            <div class="recommend-body">
                <div class="recommend-tag">${REKOMENDASI_LABEL[REKOMENDASI.tipe]}</div>
                <div class="recommend-title">${REKOMENDASI.judul}</div>
                <div class="recommend-reason">${REKOMENDASI.alasan}</div>
            </div>
            <div class="recommend-arrow">
