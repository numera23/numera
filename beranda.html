    a { text-decoration: none; color: inherit; }

       tidak melebar mengikuti lebar monitor.
       ================================================================= */
    .app-shell {
        max-width: 440px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
        position: relative;
    }

    @media (min-width: 441px) {
        .app-shell {

    .container {
        padding: 0 20px 40px;

        from { opacity: 0; transform: translateY(10px); }

       ================================================================= */

    .hero-visual {
        position: absolute;
        right: -18px;
        top: 50%;
        transform: translateY(-50%);
        width: 42%;
        max-width: 170px;
        opacity: 0.55;
        pointer-events: none;
    }

    .hero-text {
        position: relative;
        z-index: 1;
        max-width: 100%;
    }

.hero-text h2 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.32;
    color: var(--text);
    margin-bottom: 10px;
    white-space: nowrap;
}

    .hero-tagline {
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
        letter-spacing: -0.01em;

    .video-thumb {
        position: relative;
        flex-shrink: 0;
        width: 118px;
        height: 84px;
        border-radius: 12px;

    .video-thumb svg.bg {

        width: 100%;
        height: 100%;

    .video-play {

        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .video-play svg {
        width: 13px;
        height: 13px;
        color: #0F172A;
        margin-left: 1px;
    }

    .video-duration {
        position: absolute;
        right: 6px;
        bottom: 6px;
        font-size: 10px;
        font-weight: 600;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        padding: 2px 6px;
        border-radius: 6px;
    }

    .video-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .video-title {
        font-size: 14.5px;

        color: var(--text);
        letter-spacing: -0.01em;
        margin-bottom: 4px;

    .video-desc {

        line-height: 1.4;

    /* =================================================================
       BOTTOM NAVIGATION — identik dengan topik.html
       ================================================================= */
    .bottom-nav-spacer {

    .bottom-nav {

        left: 0;
        right: 0;
        bottom: 0;
        margin: 0 auto;
        width: 100%;
        max-width: 440px;
        display: flex;
        z-index: 50;
        background: rgba(255, 255, 255, 0.92);

        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));

    .nav-item {

        align-items: center;
        gap: 4px;
        padding: 6px 2px;
        color: var(--text-secondary);
        border-radius: 12px;
        text-decoration: none;
        transition: color 0.15s ease;
    }

    .nav-item svg {
        width: 22px;
        height: 22px;
    }

    .nav-item span {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
    }

    .nav-item.active {
        color: var(--primary);
    }

    .nav-item:active {
        opacity: 0.7;
    }
</style>

        ulangan: {
            warna: "red",
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><circle cx="8" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>'
        },
        materi: {
            warna: "blue",
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg>'
        },
        deadline: {
            warna: "green",
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>'
        }
    };

    function buatCardPengumuman(item) {
        const info = ICON_TIPE[item.tipe] || ICON_TIPE.materi;
        const warna = info.warna;
        const tag = item.link ? "a" : "div";
        const card = document.createElement(tag);
        card.className = "announce-card";
        if (item.link) card.href = item.link;

        const ctaHTML = item.cta
            ? `<span class="announce-cta">${item.cta}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
               </span>`
            : "";

        card.innerHTML = `
            <div class="announce-icon ${warna}">${info.svg}</div>
            <div class="announce-body">
                <div class="announce-top">
                    <span class="announce-label ${warna}">${item.label}</span>
                    <span class="announce-date ${warna}">${item.tanggal}</span>
                </div>
                <div class="announce-title">${item.judul}</div>
                <div class="announce-desc">${item.deskripsi}</div>
                ${ctaHTML}
            </div>
        `;
        return card;
    }

    function renderPengumuman() {
        const list = document.getElementById("announceList");
        list.innerHTML = "";
        PENGUMUMAN.slice(0, 3).forEach(item => {
            list.appendChild(buatCardPengumuman(item));
        });
    }

    /* =============================================================
       SEDANG DIPELAJARI
       ============================================================= */
    const SEDANG_DIPELAJARI = {
        ikon: "\uD83C\uDF3F",
        nama: "Polinomial",
        status: "Terakhir dibuka \u00B7 Hari ini",
        link: "polinomial.html"
    };

    function renderLanjut() {
        const card = document.getElementById("continueCard");
        card.href = SEDANG_DIPELAJARI.link;
        card.innerHTML = `
            <div class="continue-icon">${SEDANG_DIPELAJARI.ikon}</div>
            <div class="continue-body">
                <div class="continue-name">${SEDANG_DIPELAJARI.nama}</div>
                <div class="continue-meta">${SEDANG_DIPELAJARI.status}</div>
            </div>
            <div class="continue-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </div>
        `;
    }

    /* =============================================================
       DARI CAKRAWALA — preview video
       ============================================================= */
    const VIDEO_CAKRAWALA = {
        judul: "Mengapa 0,999... = 1?",
        deskripsi: "Penjelasan sederhana yang sering membuat kita terkejut.",
        tanggal: "2 Agustus 2026",
        durasi: "6:24",
        link: "https://www.youtube.com/"
    };

    function renderVideo() {
        const card = document.getElementById("videoCard");
        card.href = VIDEO_CAKRAWALA.link;
        card.target = "_blank";
        card.rel = "noopener";
        card.innerHTML = `
            <div class="video-thumb">
                <svg class="bg" viewBox="0 0 118 84" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="95" cy="14" r="26" fill="none" stroke="#3B82F6" stroke-width="1.2" opacity="0.35"/>
                    <line x1="10" y1="66" x2="34" y2="66" stroke="#3B82F6" stroke-width="1.2" opacity="0.3"/>
                    <line x1="22" y1="54" x2="22" y2="78" stroke="#3B82F6" stroke-width="1.2" opacity="0.3"/>
                </svg>
                <div class="video-play">
                    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
                </div>
                <span class="video-duration">${VIDEO_CAKRAWALA.durasi}</span>
            </div>
            <div class="video-body">
                <div class="video-title">${VIDEO_CAKRAWALA.judul}</div>
                <div class="video-desc">${VIDEO_CAKRAWALA.deskripsi}</div>
                <div class="video-date">${VIDEO_CAKRAWALA.tanggal}</div>
            </div>
        `;
    }

    /* =============================================================
       ICON PENCARIAN — arahkan ke halaman Topik (pencarian materi)
       ============================================================= */
    document.querySelector('[data-action="search"]').addEventListener("click", () => {
        window.location.href = "topik.html";
    });

    /* =============================================================
       INISIALISASI
       ============================================================= */
    renderPengumuman();
    renderLanjut();
    renderVideo();
</script>

</body>
</html>
