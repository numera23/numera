<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beranda | Cakrawala Matematika</title>

<style>
.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.brand-mark{
    width:28px;
    height:28px;
    border-radius:8px;
    background:#2563EB;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:0 4px 10px rgba(37,99,235,0.28);
}

.brand-name{
    font-weight:800;
    font-size:15px;
    line-height:1;
    letter-spacing:-0.01em;
}
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #2563EB;
        --primary-deep: #1E3A8A;
        --primary-mid: #1D4ED8;
        --bg: #F7F9FC;
        --card: #FFFFFF;
        --border: #E6EAF2;
        --text: #0B1324;
        --text-secondary: #64748B;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
    }

    a { text-decoration: none; color: inherit; }

    .app-shell {
        max-width: 440px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        background: radial-gradient(120% 32% at 50% 0%, rgba(37, 99, 235, 0.07), transparent 68%), var(--bg);
    }

    @media (min-width: 441px) {
        .app-shell {
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
    }

    .container {
        padding: 0 20px 40px;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
    }

    .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px 2px;
    }
    .app-header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    }

    .icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        color: var(--text-secondary);
        background: transparent;
        border: none;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
        background: var(--card);
        color: var(--primary);
    }

    .icon-btn svg { width: 20px; height: 20px; }

    .hero {
        position: relative;
        margin: 12px 0 28px;
        padding: 28px 22px 24px;
        border-radius: 22px;
        overflow: hidden;
        background:
            radial-gradient(130% 150% at 100% 0%, rgba(255, 255, 255, 0.16) 0%, transparent 55%),
            linear-gradient(155deg, var(--primary-mid) 0%, var(--primary-deep) 100%);
        box-shadow:
            0 18px 34px -14px rgba(30, 58, 138, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.14);
        animation: fadeInUp 0.5s ease both;
    }

    .hero-visual {
        position: absolute;
        right: -10px;
        bottom: -8px;
        width: 46%;
        max-width: 172px;
        opacity: 0.9;
        pointer-events: none;
    }

    .hero-text {
        position: relative;
        z-index: 1;
        max-width: 66%;
    }

    .hero-text h2 {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.3;
        color: #FFFFFF;
        margin-bottom: 14px;
    }

    .hero-tagline {
        display: inline-flex;
        align-items: center;
        font-size: 12.5px;
        font-weight: 600;
        color: #EAF0FF;
        letter-spacing: -0.005em;
        background: rgba(255, 255, 255, 0.15);
        padding: 6px 12px;
        border-radius: 20px;
    }

    .section {
        margin-bottom: 26px;
        animation: fadeInUp 0.5s ease both;
    }

    .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--text);
    }

    .section-title svg {
        width: 18px;
        height: 18px;
        color: var(--primary);
        flex-shrink: 0;
    }

    .section-link {
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
        white-space: nowrap;
    }

    .section-link svg {
        width: 14px;
        height: 14px;
        transition: transform 0.15s ease;
    }

    .section-link:hover svg { transform: translateX(3px); }

    .announce-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .announce-card {
        display: flex;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--border);
        border-radius: 16px;
        padding: 14px 14px 14px 15px;
        box-shadow: 0 3px 10px -6px rgba(15, 23, 42, 0.10);
    }

    .announce-card.red   { border-left-color: #DC2626; }
    .announce-card.blue  { border-left-color: #2563EB; }
    .announce-card.green { border-left-color: #16A34A; }

    .announce-icon {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .announce-icon svg { width: 20px; height: 20px; }

    .announce-icon.red  { background: #FEF2F2; color: #DC2626; }
    .announce-icon.blue { background: #EFF6FF; color: #2563EB; }
    .announce-icon.green{ background: #F0FDF4; color: #16A34A; }

    .announce-body { flex: 1; min-width: 0; }

    .announce-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 2px;
    }

    .announce-label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: -0.005em;
    }

    .announce-label.red  { color: #DC2626; }
    .announce-label.blue { color: #2563EB; }
    .announce-label.green{ color: #16A34A; }

    .announce-date {
        flex-shrink: 0;
        font-size: 11.5px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
    }

    .announce-date::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
    }

    .announce-date.red  { color: #DC2626; }
    .announce-date.blue { color: #2563EB; }
    .announce-date.green{ color: #16A34A; }

    .announce-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        margin: 2px 0 3px;
        letter-spacing: -0.01em;
    }

    .announce-desc {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.45;
    }

    .announce-cta {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
    }

    .announce-cta svg { width: 13px; height: 13px; }

    .recommend-card {
        display: flex;
        align-items: center;
        gap: 14px;
        background: linear-gradient(155deg, #F5F8FF 0%, #FFFFFF 60%);
        border: 1px solid #DCE6FB;
        border-radius: 18px;
        padding: 15px 15px 15px 16px;
        box-shadow: 0 8px 20px -14px rgba(37, 99, 235, 0.45);
    }

    .recommend-icon {
        flex-shrink: 0;
        width: 46px;
        height: 46px;
        border-radius: 13px;
        background: linear-gradient(155deg, var(--primary-mid), var(--primary-deep));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #FFFFFF;
        box-shadow: 0 6px 14px -6px rgba(30, 58, 138, 0.55);
    }

    .recommend-icon svg { width: 21px; height: 21px; }

    .recommend-body { flex: 1; min-width: 0; }

    .recommend-tag {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: -0.005em;
        color: var(--primary);
        background: #EAF1FF;
        padding: 2px 8px;
        border-radius: 6px;
        margin-bottom: 5px;
    }

    .recommend-title {
        font-size: 15.5px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
    }

    .recommend-reason {
        margin-top: 3px;
        font-size: 12.5px;
        color: var(--text-secondary);
        line-height: 1.4;
    }

    .recommend-arrow {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #F7F9FC;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
    }

    .recommend-arrow svg { width: 16px; height: 16px; }

    .bottom-nav-spacer {
        height: calc(72px + env(safe-area-inset-bottom));
    }

    .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0 auto;
        width: 100%;
        max-width: 440px;
        display: flex;
        z-index: 50;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border);
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 7px 2px 6px;
        color: var(--text-secondary);
        border-radius: 14px;
        text-decoration: none;
        transition: color 0.15s ease, background 0.15s ease;
    }

    .nav-item svg {
        width: 22px;
        height: 22px;
    }

    .nav-item span {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
    }

    .nav-item.active {
        color: var(--primary);
        background: #EAF1FF;
    }

    .nav-item:active {
        opacity: 0.7;
    }
</style>
</head>
<body>

<div class="app-shell">

    <div class="app-header">
    <div class="brand">
        <div class="brand-mark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="8.5" stroke="white" stroke-width="1.6"/>
                <path d="M12 3.5C14.5 6.5 15.8 9.2 15.8 12C15.8 14.8 14.5 17.5 12 20.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
                <path d="M12 3.5C9.5 6.5 8.2 9.2 8.2 12C8.2 14.8 9.5 17.5 12 20.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>

    <button class="icon-btn" type="button" aria-label="Cari" data-action="search">

    <div class="container">

            </div>
            <svg class="hero-visual" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <line x1="18" y1="18" x2="18" y2="172" stroke="#FFFFFF" stroke-width="1.4" opacity="0.55"/>
                <line x1="18" y1="172" x2="188" y2="172" stroke="#FFFFFF" stroke-width="1.4" opacity="0.55"/>
                <path d="M18 150 C 55 30, 130 20, 182 100" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>
                <line x1="126" y1="172" x2="126" y2="58" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round" opacity="0.5"/>
                <line x1="18" y1="58" x2="126" y2="58" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round" opacity="0.5"/>

        <div class="section" id="sectionPengumuman">

                <div class="section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 0 0 2 2h1l3.5 4.5V4.5L6 9H5a2 2 0 0 0-2 2Z"/><path d="M14 8a4 4 0 0 1 0 8"/><path d="M17.5 5.5a8 8 0 0 1 0 13"/></svg>

                </div>
                <a class="section-link" href="#">
                    Penting
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
  <line x1="12" y1="9" x2="12" y2="13"/>
  <line x1="12" y1="17" x2="12.01" y2="17"/>
</svg>
                </a>

        <div class="section" id="sectionRekomendasi">
            <div class="section-head">
                <div class="section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.44 1 1.15 1 1.93V17h6v-.37c0-.78.4-1.5 1-1.93A7 7 0 0 0 12 2Z"/></svg>

                </div>
            </div>
            <a class="recommend-card" href="#" id="recommendCard"></a>

    </div>

    <div class="bottom-nav-spacer"></div>

    <nav class="bottom-nav" aria-label="Navigasi utama">
        <a class="nav-item active" href="beranda.html" data-nav="beranda" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>

<script>
    const PENGUMUMAN = [
        {
            tipe: "ulangan",
            label: "Ulangan Polinomial",
            judul: "XI Isaac Newton",
            deskripsi: "Jangan lupa buat contekan.",
            tanggal: "1 Sep 2026",
            link: null,
            cta: null
        },
        {
            tipe: "materi",
            label: "Materi",
            judul: "Modul Persamaan Lingkaran",
            deskripsi: "Modul 1 sudah tersedia.",
            tanggal: "8 Ags 2026",
            link: "#",
            cta: ""
        }
    ];

    const ICON_TIPE = {
        ulangan: {
            warna: "red",
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><circle cx="8" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>'
        },
        materi: {
            warna: "blue",
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg>'
        },
        deadline: {
            warna: "green",
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>'
        }
    };

    function buatCardPengumuman(item) {
        const info = ICON_TIPE[item.tipe] || ICON_TIPE.materi;
        const warna = info.warna;
        const tag = item.link ? "a" : "div";
        const card = document.createElement(tag);
        card.className = `announce-card ${warna}`;
        if (item.link) card.href = item.link;

        const ctaHTML = item.cta
            ? `<span class="announce-cta">${item.cta}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
               </span>`
            : "";

        card.innerHTML = `
            <div class="announce-icon ${warna}">${info.svg}</div>
            <div class="announce-body">
                <div class="announce-top">
                    <span class="announce-label ${warna}">${item.label}</span>
                    <span class="announce-date ${warna}">${item.tanggal}</span>
                </div>
                <div class="announce-title">${item.judul}</div>
                <div class="announce-desc">${item.deskripsi}</div>
                ${ctaHTML}
            </div>
        `;
        return card;
    }

    function renderPengumuman() {
        const list = document.getElementById("announceList");
        list.innerHTML = "";
        PENGUMUMAN.slice(0, 3).forEach(item => {
            list.appendChild(buatCardPengumuman(item));
        });
    }

    /* =============================================================
       REKOMENDASI BELAJAR — satu saran langkah berikutnya.
       tipe: "modul" | "eksplorasi" | "arena" | "cakrawala" — menentukan label & ikon.
       Cukup ganti nilai di sini untuk mengganti tampilan card.
       ============================================================= */
    const REKOMENDASI = {
        tipe: "arena",
        judul: "Putar Dulu",
        alasan: "Putar roda keberuntungan dan mainkan game nya.",
        link: "game_putar_dulu_titik_jarijari_lingkaran.html"
    };

    const REKOMENDASI_ICON = {
        modul: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg>',
        eksplorasi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5.5L4.5 18a1.8 1.8 0 0 0 1.6 2.6h11.8A1.8 1.8 0 0 0 19.5 18L14 8.5V3"/><path d="M7.5 14h9"/></svg>',
