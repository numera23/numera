<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Eksplorasi — Numera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2563EB;
    --primary-hover:#1D4ED8;
    --primary-light:#DBEAFE;
    --bg:#F8FAFC;
    --card:#FFFFFF;
    --text:#0F172A;
    --text-secondary:#64748B;
    --border:#E2E8F0;
    --success:#10B981;
    --warning:#F59E0B;
    --error:#EF4444;

    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-soft:0 2px 10px rgba(15,23,42,0.05), 0 1px 2px rgba(15,23,42,0.04);
    --shadow-card:0 4px 16px rgba(15,23,42,0.06);
    --header-h:64px;
    --bottomnav-h:64px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button{font-family:inherit;}
  a{text-decoration:none;color:inherit;}
  .visually-hidden{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  /* ---------- Layout shell ---------- */
  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:calc(var(--bottomnav-h) + 28px);
  }

  /* ---------- Header ---------- */
  .site-header{
    position:sticky;
    top:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:12px;
    padding:8px 20px;
    background:rgba(248,250,252,0.86);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .brand-mark{
    width:26px;
    height:26px;
    border-radius:10px;
    background:linear-gradient(150deg,var(--primary),var(--primary-hover));
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:0 4px 10px rgba(37,99,235,0.28);
  }
  .brand-name{
    font-weight:800;
    font-size:14px;
    line-height:1.15;
    letter-spacing:-0.01em;
  }
  .icon-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .icon-btn:hover{border-color:var(--primary);}
  .icon-btn:active{transform:scale(0.94);}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding:8px 20px 2px;
    overflow:hidden;
  }
  .hero-content{
    position:relative;
    z-index:2;
    max-width:66%;
  }
  .hero-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    font-weight:600;
    color:var(--primary);
    background:var(--primary-light);
    padding:4px 10px 4px 8px;
    border-radius:999px;
    margin-bottom:6px;
  }
  .hero-eyebrow svg{width:12px;height:12px;}
  .hero h1{
    font-size:clamp(21px,5.5vw,25px);
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 3px;
    line-height:1.05;
  }
  .hero p{
    font-size:11.5px;
    color:var(--text-secondary);
    line-height:1.4;
    margin:0;
    max-width:340px;
  }
  .hero-svg{
    position:absolute;
    top:14px;
    right:-6px;
    width:180px;
    height:180px;
    z-index:1;
    pointer-events:none;
  }

  /* ---------- Search ---------- */
  .search-wrap{
    padding:10px 20px 4px;
  }
  .search-field{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:999px;
    padding:8px 14px;
    box-shadow:var(--shadow-soft);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-field:focus-within{
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--primary-light);
  }
  .search-field svg{flex-shrink:0;color:var(--text-secondary);width:16px;height:16px;}
  .search-field input{
    border:none;
    outline:none;
    background:transparent;
    font-family:inherit;
    font-size:13.5px;
    color:var(--text);
    width:100%;
  }
  .search-field input::placeholder{color:#94A3B8;}
  .search-clear{
    border:none;
    background:var(--border);
    color:var(--text-secondary);
    width:18px;
    height:18px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:12px;
    line-height:1;
  }
  .search-field.has-value .search-clear{display:flex;}

  /* ---------- Filter chips ---------- */
  .filters{
    display:flex;
    gap:6px;
    padding:10px 20px 4px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:4px;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    font-size:11px;
    font-weight:600;
    color:var(--text-secondary);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip svg{width:13px;height:13px;flex-shrink:0;}
  .chip:active{transform:scale(0.96);}
  .chip.active{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
    box-shadow:0 4px 10px rgba(37,99,235,0.25);
  }

  /* ---------- Groups & sections ---------- */
  .groups{
    padding:12px 20px 4px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .group{
    background:var(--card);
    border-radius:var(--radius-lg);
    border:1px solid var(--border);
    overflow:hidden;
    box-shadow:var(--shadow-card);
  }
  .group-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    background:var(--group-tint, transparent);
  }
  .group-icon{
    width:34px;
    height:34px;
    border-radius:11px;
    background:var(--group-color-light);
    color:var(--group-color);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .group-icon svg{width:17px;height:17px;}
  .group-titles{flex:1;min-width:0;}
  .group-titles h2{
    font-size:14px;
    font-weight:700;
    margin:0 0 1px;
    letter-spacing:-0.01em;
  }
  .group-titles p{
    font-size:10.5px;
    color:var(--text-secondary);
    margin:0;
    line-height:1.35;
  }
  .group-toggle{
    width:26px;
    height:26px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:transform .25s ease;
  }
  .group.collapsed .group-toggle{transform:rotate(-90deg);}
  .group-toggle svg{width:14px;height:14px;color:var(--text-secondary);}

  .card-list{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--border);
    overflow:hidden;
    max-height:2000px;
    transition:max-height .3s ease;
  }
  .group.collapsed .card-list{
    max-height:0;
    border-top:none;
  }
  .group.collapsed .group-footer{display:none;}

  .explore-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    background:var(--card);
    transition:background .15s ease;
  }
  .explore-card:last-child{border-bottom:none;}
  .explore-card:hover{background:#FAFBFF;}
  .explore-card:active{background:var(--primary-light);}

  .card-thumb{
    width:44px;
    height:44px;
    border-radius:var(--radius-sm);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .card-thumb svg{width:100%;height:100%;}

  .card-body{flex:1;min-width:0;}
  .card-body h3{
    font-size:13px;
    font-weight:700;
    margin:0 0 2px;
    letter-spacing:-0.005em;
  }
  .card-body p{
    font-size:10.5px;
    color:var(--text-secondary);
    margin:0;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .play-btn{
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
    transition:transform .15s ease;
  }
  .explore-card:active .play-btn{transform:scale(0.9);}
  .play-btn svg{width:11px;height:11px;margin-left:1.5px;}

  .group-footer{
    padding:8px 12px 10px;
    border-top:1px solid var(--border);
  }
  .view-all-btn{
    width:100%;
    border:1px solid var(--border);
    background:transparent;
    border-radius:999px;
    padding:8px;
    font-size:12px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    color:var(--group-color);
  }
  .view-all-btn svg{width:13px;height:13px;}

  /* ---------- Empty state ---------- */
  .empty-state{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:60px 30px;
    color:var(--text-secondary);
  }
  .empty-state svg{width:64px;height:64px;margin-bottom:16px;color:#CBD5E1;}
  .empty-state h3{font-size:16px;color:var(--text);margin:0 0 6px;}
  .empty-state p{font-size:13.5px;margin:0;max-width:260px;line-height:1.5;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:50;
    display:flex;
    max-width:560px;
    margin:0 auto;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--border);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:6px 2px;
    color:var(--text-secondary);
    border-radius:12px;
    transition:color .15s ease;
  }
  .nav-item svg{width:22px;height:22px;}
  .nav-item span{font-size:10.5px;font-weight:600;letter-spacing:-0.01em;}
  .nav-item.active{color:var(--primary);}
  .nav-item:active{opacity:0.7;}

  @media (min-width:561px){
    .app{border-left:1px solid var(--border);border-right:1px solid var(--border);}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  /* ---------- Page enter animation (konsisten dengan Beranda/Topik) ---------- */
  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .page-enter{
    animation:fadeInUp 0.45s ease both;
  }
  .page-enter-1{animation-delay:0.03s;}
  .page-enter-2{animation-delay:0.08s;}
  .page-enter-3{animation-delay:0.13s;}

  .float-dot{animation:floaty 5s ease-in-out infinite;}
  .float-dot2{animation:floaty 6.5s ease-in-out infinite .8s;}
  @keyframes floaty{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-7px);}
  }
</style>
</head>
<body>

<div class="app">

  <!-- ===================== HEADER ===================== -->
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8.5" stroke="white" stroke-width="1.6"/>
          <path d="M12 3.5C14.5 6.5 15.8 9.2 15.8 12C15.8 14.8 14.5 17.5 12 20.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M12 3.5C9.5 6.5 8.2 9.2 8.2 12C8.2 14.8 9.5 17.5 12 20.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="1.4" fill="white"/>
        </svg>
      </div>
      <span class="brand-name">Numera</span>
    </div>
  </header>

  <!-- ===================== HERO ===================== -->
  <section class="hero page-enter">
    <svg class="hero-svg" viewBox="0 0 200 200" fill="none">
      <path d="M30 60 C55 40, 70 75, 95 55 C115 40, 130 60, 150 45" stroke="#BFDBFE" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
      <circle class="float-dot" cx="30" cy="60" r="4.5" fill="var(--primary)"/>
      <circle cx="150" cy="45" r="3" fill="#93C5FD"/>
      <circle class="float-dot2" cx="95" cy="55" r="52" stroke="#DBEAFE" stroke-width="1.4" fill="none" stroke-dasharray="3 6"/>
      <circle cx="95" cy="55" r="30" stroke="#DBEAFE" stroke-width="1.4" fill="none"/>
      <path d="M40 150 L170 120" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>
      <path d="M170 120 L156 116 M170 120 L163 132" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="float-dot" cx="40" cy="150" r="4" fill="#1D4ED8"/>
    </svg>
    <div class="hero-content">
      <span class="hero-eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5.5L4.5 18a1.8 1.8 0 0 0 1.6 2.6h11.8A1.8 1.8 0 0 0 19.5 18L14 8.5V3"/></svg>
        Laboratorium
      </span>
      <h1>Eksplorasi</h1>
      <p>Coba dulu. Amati apa yang terjadi. Baru cari tahu kenapa.</p>
    </div>
  </section>

  <!-- ===================== SEARCH ===================== -->
  <div class="search-wrap page-enter page-enter-1">
    <div class="search-field" id="searchField">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Cari eksplorasi..." autocomplete="off">
      <button class="search-clear" id="searchClear" aria-label="Hapus pencarian">✕</button>
    </div>
  </div>

  <!-- ===================== FILTER CHIPS ===================== -->
  <nav class="filters page-enter page-enter-2" id="filters">
    <button class="chip active" data-filter="semua">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Semua
    </button>
    <button class="chip" data-filter="geometri">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
      Geometri
    </button>
    <button class="chip" data-filter="aljabar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c2-1 3-6 5-6s2 5 4 5 2-8 5-8"/></svg>
      Aljabar
    </button>
    <button class="chip" data-filter="trigonometri">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c4 0 4 12 8 12s4-12 8-12"/></svg>
      Trigonometri
    </button>
    <button class="chip" data-filter="lainnya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
      Lainnya
    </button>
  </nav>

  <!-- ===================== EXPLORATION GROUPS ===================== -->
  <main class="groups page-enter page-enter-3" id="groups"></main>

  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <h3>Tidak ditemukan</h3>
    <p>Coba kata kunci lain atau pilih kategori yang berbeda.</p>
  </div>

  <!-- ===================== BOTTOM NAVIGATION ===================== -->
  <!-- Struktur navigasi utama. Ganti atribut href pada tiap <a> sesuai kebutuhan. -->
  <nav class="bottom-nav" aria-label="Navigasi utama">
    <!-- GANTI href di bawah ini ke halaman Beranda yang sebenarnya -->
    <a class="nav-item" href="beranda.html" data-nav="beranda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
      <span>Beranda</span>
    </a>
    <!-- GANTI href di bawah ini ke halaman Topik yang sebenarnya -->
    <a class="nav-item" href="topik.html" data-nav="topik">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 16.5h7"/></svg>
      <span>Topik</span>
    </a>
    <!-- GANTI href di bawah ini ke halaman Eksplorasi yang sebenarnya (saat ini halaman aktif) -->
    <a class="nav-item active" href="eksplorasi.html" data-nav="eksplorasi" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5.5L4.5 18a1.8 1.8 0 0 0 1.6 2.6h11.8A1.8 1.8 0 0 0 19.5 18L14 8.5V3"/><path d="M7.5 14h9"/></svg>
      <span>Eksplorasi</span>
    </a>
    <!-- GANTI href di bawah ini ke halaman Arena Game yang sebenarnya -->
    <a class="nav-item" href="arena.html" data-nav="arena">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="10" rx="5"/><line x1="7" y1="13" x2="7" y2="13.01"/><line x1="7" y1="10.5" x2="7" y2="15.5"/><line x1="5.5" y1="13" x2="8.5" y2="13"/><circle cx="16" cy="11.5" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>
      <span>Arena Game</span>
    </a>
    <!-- GANTI href di bawah ini ke halaman Cakrawala yang sebenarnya -->
    <a class="nav-item" href="cakrawala.html" data-nav="Cakrawala">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5-6-3.5Z"/></svg>
      <span>Cakrawala</span>
    </a>
  </nav>

</div>

<script>
/* =========================================================================
   PUSTAKA IKON THUMBNAIL
   -------------------------------------------------------------------------
   Ini SATU-SATUNYA tempat bentuk ikon didefinisikan. Setiap kunci adalah
   nama pendek yang bisa dipakai berkali-kali di EXPLORATION_DATA lewat
   properti `icon`. Path/lingkaran di dalamnya pakai stroke/fill="currentColor"
   supaya warnanya OTOMATIS ikut warna kelompok (group.color) — tidak perlu
   diatur manual lagi per item.

   Cara menambah bentuk baru: cukup tambah satu entri { key: svgFragment }
   di bawah ini. Tidak perlu menyentuh bagian render/data lain.

const PREVIEW_COUNT = 3;

const groupsEl = document.getElementById('groups');
const emptyStateEl = document.getElementById('emptyState');
const searchInput = document.getElementById('searchInput');
const searchField = document.getElementById('searchField');
const searchClear = document.getElementById('searchClear');
const filtersEl = document.getElementById('filters');

let activeFilter = 'semua';
let searchTerm = '';
let expandedGroups = new Set();
let openGroups = new Set();

function normalize(str){
  return str.toLowerCase();
}

function matchesSearch(item, group){
  if(!searchTerm) return true;
  const haystack = normalize(item.name + ' ' + item.description + ' ' + group.name);
  return haystack.includes(searchTerm);
}

function matchesFilter(group){
  if(activeFilter === 'semua') return true;
  return group.filterKey === activeFilter;
}

/* Kalau beberapa item dalam satu grup memakai `icon` yang SAMA (wajar kalau
   masih satu topik, mis. 3 eksplorasi "barisan-aritmatika"), thumbnail-nya
   otomatis divariasikan (dibalik/diputar) berdasarkan urutan kemunculan —
   supaya tidak terlihat kembar identik, tanpa Anda perlu mengatur apa-apa
   secara manual. Urutan dihitung dari EXPLORATION_DATA aslinya (bukan dari
   hasil filter/pencarian) supaya variannya konsisten kapan pun dilihat. */
const ICON_VARIANTS = ['', 'scaleX(-1)', 'rotate(180deg)', 'scaleX(-1) rotate(180deg)'];

function getIconVariantIndex(group, item){
  const key = item.icon || 'default';
  let seen = 0;
  for(const it of group.items){
    if((it.icon || 'default') === key){
      if(it === item) return seen;
      seen++;
    }
  }
  return 0;
}

/* Bangun thumbnail 64x64 dari ICON_LIBRARY + warna grup — otomatis,
   tidak perlu SVG manual per item. */
function renderThumb(item, group){
  const shape = ICON_LIBRARY[item.icon] || ICON_LIBRARY.default;
  const variant = ICON_VARIANTS[getIconVariantIndex(group, item) % ICON_VARIANTS.length];
  const transformStyle = variant ? `transform:${variant};transform-origin:32px 32px;` : '';
  return `<svg viewBox="0 0 64 64" style="color:${group.color};${transformStyle}">
      <rect width="64" height="64" fill="${group.colorLight}"/>
      ${shape}
    </svg>`;
}

function render(){
  groupsEl.innerHTML = '';
  let anyVisible = false;

  EXPLORATION_DATA.forEach(group => {
    if(!matchesFilter(group)) return;

    const filteredItems = group.items.filter(item => matchesSearch(item, group));
    if(filteredItems.length === 0) return;

    anyVisible = true;
    const isExpanded = expandedGroups.has(group.id) || searchTerm.length > 0;
    const itemsToShow = isExpanded ? filteredItems : filteredItems.slice(0, PREVIEW_COUNT);
    const hasMore = !isExpanded && filteredItems.length > PREVIEW_COUNT;

    const isOpen = openGroups.has(group.id) || searchTerm.length > 0;

    const groupEl = document.createElement('section');
    groupEl.className = 'group' + (isOpen ? '' : ' collapsed');
    groupEl.style.setProperty('--group-color', group.color);
    groupEl.style.setProperty('--group-color-light', group.colorLight);

    groupEl.innerHTML = `
      <div class="group-head" data-toggle="${group.id}">
        <div class="group-icon">${group.icon}</div>
        <div class="group-titles">
          <h2>${group.name}</h2>
          <p>${filteredItems.length} eksplorasi &bull; ${group.description}</p>
        </div>
        <div class="group-toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="card-list">
        ${itemsToShow.map(item => `
          <!-- GANTI atribut href di bawah ini ke URL eksplorasi sebenarnya -->
          <a class="explore-card" href="${item.href}">
            <div class="card-thumb">${renderThumb(item, group)}</div>
            <div class="card-body">
              <h3>${item.name}</h3>
              <p>${item.description}</p>
            </div>
            <div class="play-btn" style="background:${group.color}">
              <svg viewBox="0 0 24 24" fill="white"><path d="M6 4.5v15l14-7.5-14-7.5Z"/></svg>
            </div>
          </a>
        `).join('')}
      </div>
      ${hasMore ? `
      <div class="group-footer">
        <button class="view-all-btn" data-viewall="${group.id}">
          Lihat semua ${filteredItems.length} eksplorasi
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>` : ''}
    `;

    groupsEl.appendChild(groupEl);
  });

  emptyStateEl.style.display = anyVisible ? 'none' : 'flex';
}

/* --- Search --- */
searchInput.addEventListener('input', () => {
  searchTerm = normalize(searchInput.value.trim());
  searchField.classList.toggle('has-value', searchInput.value.length > 0);
  render();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchTerm = '';
  searchField.classList.remove('has-value');
  render();
  searchInput.focus();
});

/* --- Filter chips --- */
filtersEl.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  filtersEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.filter;
  render();
});

/* --- Expand / collapse group + "view all" --- */
groupsEl.addEventListener('click', (e) => {
  const viewAllBtn = e.target.closest('[data-viewall]');
  if(viewAllBtn){
    e.preventDefault();
    expandedGroups.add(viewAllBtn.dataset.viewall);
    render();
    return;
  }
  const head = e.target.closest('[data-toggle]');
  if(head){
    const id = head.dataset.toggle;
    const groupEl = head.closest('.group');
    groupEl.classList.toggle('collapsed');
    if(groupEl.classList.contains('collapsed')){
      openGroups.delete(id);
    } else {
      openGroups.add(id);
    }
  }
});

render();
</script>
