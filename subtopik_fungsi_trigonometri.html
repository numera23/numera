<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fungsi Trigonometri | Numera</title>

<!--
    =====================================================================
    NUMERA — TEMPLATE HALAMAN DETAIL TOPIK (LANDING PAGE BAB)
    =====================================================================
    Ini adalah file MASTER / TEMPLATE.

    Halaman ini BUKAN daftar isi biasa — ini landing page untuk satu bab,
    supaya siswa merasa "memasuki" satu bab pembelajaran yang utuh
    sebelum memilih subbab yang ingin dipelajari.

    File ini dipakai untuk SEMUA halaman topik (polinomial.html,
    limit.html, statistika.html, peluang.html, dst).

    CARA MEMAKAI UNTUK TOPIK BARU
    -------------------------------
    1. Duplikat/copy file ini, ganti namanya sesuai topik.
       Contoh: limit.html, statistika.html
    2. Ubah <title> di atas.
    3. Ubah object TOPIK_INFO di bagian <script> (nama, ikon, deskripsi).
    4. Ubah array KOMPETENSI — daftar poin capaian bab ini.
    5. Ubah array SUBMODUL — isi dengan subbab beserta link halaman
       materinya masing-masing.
    6. Simpan & upload ke GitHub Pages.

    TIDAK PERLU mengubah HTML atau CSS sama sekali — cukup tiga
    bagian data di <script> (TOPIK_INFO, KOMPETENSI, SUBMODUL).

    Tombol "← Topik Pembelajaran" selalu mengarah ke topik.html,
    jadi biarkan href itu apa adanya di semua salinan file ini.

    Warna di seluruh halaman ini SERAGAM primary (#2563EB) untuk
    semua topik — perbedaan identitas antar bab cukup dari emoji,
    judul, dan deskripsi, bukan dari warna tema yang berbeda-beda.
    =====================================================================
-->

<style>
    /* =================================================================
       RESET & DASAR (identik dengan topik.html agar konsisten)
       ================================================================= */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #2563EB;
        --primary-soft: #EFF6FF;
        --primary-soft-2: #DBEAFE;
        --bg: #F8FAFC;
        --card: #FFFFFF;
        --border: #E2E8F0;
        --text: #0F172A;
        --text-secondary: #64748B;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
    }

    /* =================================================================
       APP SHELL — canvas mobile
       Membatasi seluruh halaman ke lebar aplikasi HP, konsisten dengan
       topik.html. Di layar PC/laptop, konten tetap sempit dan berada
       di tengah, tidak melebar mengikuti lebar monitor.
       ================================================================= */
    .app-shell {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
        position: relative;
    }

    @media (min-width: 561px) {
        .app-shell {
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
    }

    .container {
        max-width: 880px;
        margin: 0 auto;
        padding: 0 20px 64px;
    }

    /* =================================================================
       BREADCRUMB / BACK LINK
       ================================================================= */
    .back-link-wrap {
        padding: 18px 0 0;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 500;
        padding: 6px 0;
        transition: color 0.2s ease;
    }

    .back-link:hover {
        color: var(--primary);
    }

    /* =================================================================
       HERO SECTION
       ================================================================= */
    .hero {
        position: relative;
        text-align: center;
        padding: 28px 20px 40px;
        overflow: hidden;
        animation: fadeInUp 0.5s ease both;
    }

    /* dekorasi blob — murni CSS, tidak ada gambar/aset eksternal */
    .hero-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
        z-index: 0;
        pointer-events: none;
    }

    .hero-blob-1 {
        width: 240px;
        height: 240px;
        background: var(--primary-soft-2);
        top: -80px;
        left: 50%;
        transform: translateX(-60%);
        opacity: 0.8;
    }

    .hero-blob-2 {
        width: 180px;
        height: 180px;
        background: var(--primary-soft);
        top: -20px;
        left: 50%;
        transform: translateX(20%);
        opacity: 0.9;
    }

    .hero-content {
        position: relative;
        z-index: 1;
    }

    .hero-icon {
        width: 88px;
        height: 88px;
        margin: 0 auto 18px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
    }

    .hero-title {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
        color: var(--text);
    }

    .hero-desc {
        max-width: 520px;
        margin: 0 auto;
        font-size: 15px;
        color: var(--text-secondary);
        line-height: 1.65;
    }

    /* =================================================================
       KOMPETENSI
       ================================================================= */
    .kompetensi-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px 24px;
        margin-bottom: 28px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        animation: fadeInUp 0.5s ease 0.05s both;
    }

    .kompetensi-header {
        margin-bottom: 14px;
    }

    .kompetensi-header h2 {
        font-size: 15.5px;
        font-weight: 700;
        margin-bottom: 3px;
    }

    .kompetensi-header p {
        font-size: 12.5px;
        color: var(--text-secondary);
    }

    .kompetensi-list {
        list-style: none;
    }

    .kompetensi-list li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 14px;
        color: var(--text);
        padding: 7px 0;
    }

    .kompetensi-list li::before {
        content: "✓";
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--primary-soft-2);
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1px;
    }

    /* =================================================================
       DAFTAR SUBBAB
       ================================================================= */
    .subbab-heading {
        font-size: 15.5px;
        font-weight: 700;
        margin-bottom: 14px;
        animation: fadeInUp 0.5s ease 0.08s both;
    }

    .submodul-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* seluruh card adalah tombol — tidak ada tombol "Masuk" terpisah,
       supaya area sentuh besar dan nyaman di mobile */
    .submodul-card {
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px 20px;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        animation: fadeInUp 0.45s ease both;
    }

    .submodul-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        border-color: var(--primary-soft-2);
    }

    .submodul-card:active {
        transform: translateY(-1px);
    }

    /* nomor urut — dipertahankan karena subbab memang urutan belajar nyata */
    .submodul-nomor {
        flex-shrink: 0;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        color: var(--primary);
        background: var(--primary-soft);
    }

    .submodul-icon {
        flex-shrink: 0;
        font-size: 22px;
        width: 32px;
        text-align: center;
    }

    .submodul-body {
        flex: 1;
        min-width: 0;
    }

    .submodul-judul {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 2px;
        letter-spacing: -0.01em;
    }

    .submodul-deskripsi {
    font-size: 13px;
    color: var(--text-secondary);
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-height: 1.4;
    }

    .submodul-arrow {
        flex-shrink: 0;
        font-size: 18px;
        color: var(--text-secondary);
        transition: transform 0.2s ease, color 0.2s ease;
    }

    .submodul-card:hover .submodul-arrow {
        transform: translateX(4px);
        color: var(--primary);
    }

    .submodul-card:nth-child(1) { animation-delay: 0.1s; }
    .submodul-card:nth-child(2) { animation-delay: 0.14s; }
    .submodul-card:nth-child(3) { animation-delay: 0.18s; }
    .submodul-card:nth-child(4) { animation-delay: 0.22s; }
    .submodul-card:nth-child(5) { animation-delay: 0.26s; }
    .submodul-card:nth-child(n+6) { animation-delay: 0.3s; }

    /* =================================================================
       FOOTER
       ================================================================= */
    footer {
        text-align: center;
        padding: 28px 20px 36px;
        font-size: 13px;
        color: var(--text-secondary);
        border-top: 1px solid var(--border);
        margin-top: 12px;
    }

    /* =================================================================
       ANIMASI
       ================================================================= */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        * {
            animation: none !important;
            transition: none !important;
        }
    }

    /* =================================================================
       RESPONSIF — desktop sedikit lebih lega
       ================================================================= */
    @media (min-width: 640px) {
        .hero {
            padding: 40px 20px 48px;
        }

        .hero-title {
            font-size: 34px;
        }
    }

    /* =================================================================
       BOTTOM NAVIGATION
       Standar navigasi utama Numera: 5 menu, fixed di
       bawah, lebar mengikuti canvas mobile (tidak melebar di PC/laptop).
       Identik dengan bottom navigation pada topik.html.
       ================================================================= */
    .bottom-nav-spacer {
        height: calc(72px + env(safe-area-inset-bottom));
    }

    .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0 auto;
        width: 100%;
        max-width: 560px;
        display: flex;
        z-index: 50;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border);
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 2px;
        color: var(--text-secondary);
        border-radius: 12px;
        text-decoration: none;
        transition: color 0.15s ease;
    }

    .nav-item svg {
        width: 22px;
        height: 22px;
    }

    .nav-item span {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
    }

    .nav-item.active {
        color: var(--primary);
    }

    .nav-item:active {
        opacity: 0.7;
    }
</style>
</head>
<body>

    <div class="app-shell">

    <div class="container">

        <!-- ================= BREADCRUMB ================= -->
        <div class="back-link-wrap">
            <a class="back-link" href="topik.html">← Topik Pembelajaran</a>
        </div>

        <!-- ================= HERO (isi otomatis dari TOPIK_INFO) ================= -->
        <div class="hero">
            <div class="hero-blob hero-blob-1"></div>
            <div class="hero-blob hero-blob-2"></div>
            <div class="hero-content">
                <div class="hero-icon" id="heroIcon"></div>
                <h1 class="hero-title" id="heroTitle"></h1>
                <p class="hero-desc" id="heroDesc"></p>
            </div>
        </div>

        <!-- ================= KOMPETENSI (diisi otomatis dari array KOMPETENSI) ================= -->
        <div class="kompetensi-card">
            <div class="kompetensi-header">
                <h2>🎯 Setelah ini, kamu akan bisa apa?</h2>
                <p>Gambaran umum bab ini, bukan materi lengkap.</p>
            </div>
            <ul class="kompetensi-list" id="kompetensiList"></ul>
        </div>

        <!-- ================= DAFTAR SUBBAB ================= -->
        <h2 class="subbab-heading">Subbab dalam bab ini</h2>
        <div class="submodul-list" id="submodulList"></div>

    </div>

    <!-- ================= SPACER — mencegah konten tertutup bottom navigation ================= -->
    <div class="bottom-nav-spacer"></div>

    <!-- ================= FOOTER ================= -->
    <footer>
        Numera
    </footer>

    <!-- ================= BOTTOM NAVIGATION ================= -->
    <!-- Struktur navigasi utama Numera (5 menu). -->
    <!-- Ganti atribut href pada tiap <a> sesuai halaman tujuan. -->
    <nav class="bottom-nav" aria-label="Navigasi utama">
        <!-- GANTI href di bawah ini ke halaman Beranda yang sebenarnya -->
        <a class="nav-item" href="beranda.html" data-nav="beranda">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
            <span>Beranda</span>
        </a>
        <!-- Topik: menu aktif — Sub Topik masih berada di dalam bagian Topik -->
        <a class="nav-item active" href="topik.html" data-nav="topik" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 16.5h7"/></svg>
            <span>Topik</span>
        </a>
        <!-- GANTI href di bawah ini ke halaman Eksplorasi yang sebenarnya -->
        <a class="nav-item" href="eksplorasi.html" data-nav="eksplorasi">

        <!-- GANTI href di bawah ini ke halaman Arena Game yang sebenarnya -->
        <a class="nav-item" href="arena.html" data-nav="arena">

        </a>
    </nav>

    </div>

    <script>
        /* =============================================================
           DATA TOPIK — GANTI BAGIAN INI UNTUK SETIAP TOPIK BARU
           ============================================================= */
        const TOPIK_INFO = {
            nama: "Fungsi Trigonometri",
            ikon: "📈",
            deskripsi: "Pelajari cara mengidentifikasi amplitudo, fase, periode, dan transformasi grafik sinus, cosinus, & tangen."
        };

        /* =============================================================
           DATA KOMPETENSI — GANTI BAGIAN INI UNTUK SETIAP TOPIK BARU
           -------------------------------------------------------------
           Setiap baris adalah satu poin capaian belajar, ditampilkan
           sebagai checklist. Cukup daftar teks (string), tanpa struktur
           tambahan.
           ============================================================= */
        const KOMPETENSI = [
            "Mengenali Grafik Sinus, Cosinus, & Tangen.",
            "Menentukan amplitudo, periode, & fase.",
            "Mengetahui transformasi grafik fungsi.",
            "Mengetahui pergeseran grafik fungsi."
        ];

        /* =============================================================
           DATA SUBBAB — GANTI BAGIAN INI UNTUK SETIAP TOPIK BARU
           -------------------------------------------------------------
           Setiap object subbab memiliki:
             judul      : nama subbab (string)
             ikon       : emoji kecil untuk subbab ini (string)
             deskripsi  : deskripsi singkat, 1 kalimat (string)
             link       : file/halaman materi tujuan saat diklik (string)

           Nomor urut ditampilkan otomatis sesuai urutan array —
           susun dari atas ke bawah sesuai urutan belajar yang dianjurkan.
           ============================================================= */
        const SUBMODUL = [
            {
                judul: "Konsep Fungsi Trigonometri",
                ikon: "📉",
                deskripsi: "Kenali fungsi trigonometri",
                link: "fungtrig_konsep.html"
            },
            {
                judul: "Sudut & Radian",
                ikon: "💹",
                deskripsi: "Pahami sudut dan radian.",
                link: "fungtrig_sudutradian.html"
            },
            {
                judul: "Amplitudo, Periode, & Fase",
                ikon: "📈",
                deskripsi: "Kenali karakteristik grafik.",
                link: "fungtrig_amplitudo_periode.html"
            },
            {
                judul: "Grafik Sinus & Cosinus",
                ikon: "📉",
                deskripsi: "Pelajari grafik sinus dan cosinus.",
                link: "fungtrig_grafik_sincos.html"
            },
            {
                judul: "Transformasi Grafik Fungsi",
                ikon: "💹",
                deskripsi: "Amati perubahan grafik.",
                link: "fungtrig_transformasi.html"
            },
            {
                judul: "Grafik Fungsi Tangen",
                ikon: "📈",
                deskripsi: "Kenali grafik dan asimtot tangen.",
                link: "fungtrig_grafik_tangen.html"
            },
            {
                judul: "Pemodelan Fungsi Trigonometri",
                ikon: "📉",
                deskripsi: "Terapkan trigonometri pada fenomena periodik.",
                link: "fungtrig_pemodelan.html"
            },
            {
                judul: "Persamaan Fungsi Trigonometri",
                ikon: "💹",
                deskripsi: "Pelajari persamaan trigonometri.",
                link: "fungtrig_persamaan.html"
            }

            // Tambahkan subbab baru di sini, contoh:
            // {
            //     judul: "Latihan Soal Polinomial",
            //     ikon: "📝",
            //     deskripsi: "Kumpulan soal dan pembahasan bab ini.",
            //     link: "polinomial-latihan.html"
            // },
        ];

        /* =============================================================
           RENDER HERO
           ============================================================= */
        document.getElementById("heroIcon").textContent = TOPIK_INFO.ikon;
        document.getElementById("heroTitle").textContent = TOPIK_INFO.nama;
        document.getElementById("heroDesc").textContent = TOPIK_INFO.deskripsi;
        document.title = `${TOPIK_INFO.nama} | Numera`;

        /* =============================================================
           RENDER KOMPETENSI
           ============================================================= */
        const kompetensiListEl = document.getElementById("kompetensiList");

        KOMPETENSI.forEach(poin => {
            const li = document.createElement("li");
            li.textContent = poin;
            kompetensiListEl.appendChild(li);
        });

        /* =============================================================
           RENDER DAFTAR SUBBAB
           ============================================================= */
        const submodulListEl = document.getElementById("submodulList");

        SUBMODUL.forEach((sub, index) => {
            const card = document.createElement("a");
            card.className = "submodul-card";
            card.href = sub.link;

            card.innerHTML = `
                <div class="submodul-nomor">${index + 1}</div>
                <div class="submodul-icon">${sub.ikon}</div>
                <div class="submodul-body">
                    <div class="submodul-judul">${sub.judul}</div>
                    <div class="submodul-deskripsi">${sub.deskripsi}</div>
                </div>
                <div class="submodul-arrow">›</div>
            `;

            submodulListEl.appendChild(card);
        });
    </script>
