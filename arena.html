<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena Game | Numera</title>

<!--
    =====================================================================
    Numera — arena.html
    =====================================================================
    Halaman ini adalah ETALASE/KATALOG game & kuis matematika eksternal
    (Blooket, Kahoot, ZEP, Quizizz, dll). Game TIDAK ditanam ke halaman —
    tombol "Mainkan" membuka link platform eksternal di tab baru.

    Kerangka teknis & visual (app-shell mobile canvas, typography, warna,
    bottom navigation) mengikuti beranda.html (berandav3_1.html).
    File ini TIDAK mengubah halaman lain.

    CARA MENAMBAH / MENGUBAH GAME
    -------------------------------
    Semua game ada pada array GAMES di bagian <script> paling bawah.
    Cukup salin satu blok { ... }, tempel, lalu ganti teks di dalamnya.
    Field "platform" HARUS salah satu dari: "Blooket", "Kahoot", "ZEP",
    "Quizizz" — platform lain akan otomatis masuk kategori "Lainnya".

    Bagian "Lanjutkan" dan "Game sesuai materi yang sedang dipelajari"
    diatur lewat LANJUTKAN dan MATERI_AKTIF — jumlah game yang tertulis
    di sana dihitung otomatis dari isi GAMES, bukan angka manual.
    =====================================================================
-->

<style>
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(150deg,var(--primary),var(--primary-hover));
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  box-shadow:0 4px 10px rgba(37,99,235,0.28);
}

.brand-name{
  font-weight:800;
  font-size:14px;
  line-height:1.18;
  letter-spacing:-0.01em;
}   
   * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --primary: #2563EB;
        --primary-hover: #1D4ED8;
        --primary-light: #DBEAFE;
        --bg: #F8FAFC;
        --card: #FFFFFF;
        --border: #E5E7EB;
        --text: #0F172A;
        --text-secondary: #64748B;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; }

    /* =================================================================
       APP SHELL — canvas mobile (konsisten dengan halaman lain)
       ================================================================= */
    .app-shell {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
        position: relative;
    }

    @media (min-width: 561px) {
        .app-shell {
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
    }

    .container { padding: 0 20px 8px; }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
    }

    /* =================================================================
       HEADER
       ================================================================= */
    .app-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 20px 20px 4px;
    }

    .app-header h1 {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--text);
    }

    .icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        color: var(--text-secondary);
        background: var(--card);
        border: 1px solid var(--border);
        cursor: pointer;
        flex-shrink: 0;
        transition: border-color 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* =================================================================
       HERO
       ================================================================= */
    .hero {
        position: relative;
        margin: 16px 0 28px;
        padding: 24px 22px;
        border-radius: 20px;
        overflow: hidden;
        background: linear-gradient(155deg, #EFF4FF 0%, #F8FAFC 65%);
        border: 1px solid var(--border);
        animation: fadeInUp 0.5s ease both;
    }

    .hero-text { position: relative; z-index: 1; max-width: 64%; }

    .hero-text h2 {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.28;
        color: var(--text);
        margin-bottom: 8px;
    }

    .hero-text p {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.5;
    }

    .hero-visual {
        position: absolute;
        right: -6px;
        bottom: -8px;
        width: 130px;
        height: 130px;
        pointer-events: none;
    }

    /* =================================================================
       SECTION HEADING (dipakai berulang)
       ================================================================= */
    .section { margin-bottom: 26px; animation: fadeInUp 0.5s ease both; }

    .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        gap: 10px;
    }

    .section-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.03em;
        color: var(--text);
        text-transform: uppercase;
    }

    .section-title svg { width: 16px; height: 16px; color: var(--primary); }

    .section-link {
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
        white-space: nowrap;
        flex-shrink: 0;
    }
    .section-link svg { width: 14px; height: 14px; }

    /* =================================================================
       LANJUTKAN — kartu platform horizontal scroll
       ================================================================= */
    .lanjut-scroll {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scrollbar-width: none;
        padding-bottom: 2px;
    }
    .lanjut-scroll::-webkit-scrollbar { display: none; }

    .lanjut-card {
        flex: 0 0 auto;
        width: 148px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 1px 2px rgba(15,23,42,0.03);
    }

    .lanjut-badge {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 15px;
        color: #fff;
        margin-bottom: 10px;
    }

    .lanjut-materi {
        font-size: 14.5px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
        line-height: 1.3;
        margin-bottom: 10px;
    }

    .lanjut-count {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
    }
    .lanjut-count svg { width: 14px; height: 14px; color: var(--primary); flex-shrink: 0; }

    /* =================================================================
       GAME SESUAI MATERI YANG SEDANG DIPELAJARI (featured)
       ================================================================= */
    .featured-card {
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 1px 2px rgba(15,23,42,0.03);
    }

    @media (min-width: 400px) {
        .featured-card { flex-direction: row; align-items: center; }
    }

    .featured-thumb {
        flex-shrink: 0;
        width: 100%;
        height: 108px;
        border-radius: 13px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
        padding: 14px;
        background: linear-gradient(155deg, #6D28D9 0%, #4C1D95 55%, #1E3A8A 100%);
    }
    @media (min-width: 400px) {
        .featured-thumb { width: 116px; height: 100px; }
    }

    .featured-thumb-deco {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .featured-thumb-platform {
        position: absolute;
        top: 10px;
        left: 12px;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 8px;
        background: rgba(255,255,255,0.16);
        backdrop-filter: blur(2px);
        font-size: 11px;
        font-weight: 800;
        color: #fff;
    }
    .featured-thumb-platform svg { width: 13px; height: 13px; }

    .featured-thumb-title {
        position: relative;
        z-index: 1;
        color: #fff;
        font-weight: 800;
        font-size: 15.5px;
        letter-spacing: -0.01em;
        line-height: 1.2;
        text-transform: uppercase;
        text-shadow: 0 1px 3px rgba(0,0,0,0.25);
    }

    .featured-body { flex: 1; min-width: 0; }

    .featured-platform {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }
    .featured-platform-badge {
        width: 18px; height: 18px; border-radius: 5px;
        display: flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 800; color: #fff; flex-shrink: 0;
    }

    .featured-title {
        font-size: 16.5px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.01em;
        margin-bottom: 4px;
    }

    .featured-desc {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.45;
        margin-bottom: 10px;
    }

    .featured-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .featured-count {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
    }
    .featured-count svg { width: 14px; height: 14px; color: var(--primary); flex-shrink: 0; }

    .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--primary);
        color: #fff;
        font-size: 13.5px;
        font-weight: 700;
        padding: 9px 16px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary svg { width: 14px; height: 14px; }

    .badge-baru {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        color: #16A34A;
        background: #F0FDF4;
        border: 1px solid #DCFCE7;
        padding: 3px 10px;
        border-radius: 999px;
        margin-left: 8px;
    }

    /* =================================================================
       SEMUA GAME & KUIS — filter + list
       ================================================================= */
    .filters {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        padding-bottom: 14px;
    }
    .filters::-webkit-scrollbar { display: none; }

    .chip {
        flex-shrink: 0;
        padding: 8px 15px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s ease;
    }
    .chip:active { transform: scale(0.96); }
    .chip.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
        box-shadow: 0 4px 10px rgba(37,99,235,0.2);
    }

    .game-list {
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(15,23,42,0.03);
    }

    .game-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        border-bottom: 1px solid var(--border);
    }
    .game-row:last-child { border-bottom: none; }

    .game-badge {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 14px;
        color: #fff;
    }
    .game-badge svg { width: 18px; height: 18px; }

    .game-info { flex: 1; min-width: 0; }
    .game-name {
        font-size: 14.5px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .game-meta {
        font-size: 12px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .game-meta .dot {
        width: 3px; height: 3px; border-radius: 50%;
        background: var(--text-secondary); flex-shrink: 0;
    }

    .btn-outline {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        font-weight: 700;
        color: var(--primary);
        border: 1.5px solid var(--primary-light);
        background: #fff;
        padding: 7px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s ease;
    }
    .btn-outline:hover { background: var(--primary-light); }

    .load-more {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        width: 100%;
        margin-top: 14px;
        padding: 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--primary);
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
    }
    .load-more svg { width: 15px; height: 15px; transition: transform 0.15s ease; }
    .load-more.expanded svg { transform: rotate(180deg); }

    .empty-state {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 50px 24px;
        color: var(--text-secondary);
    }
    .empty-state.show { display: flex; }
    .empty-state svg { width: 46px; height: 46px; margin-bottom: 12px; color: #CBD5E1; }
    .empty-state p { font-size: 13.5px; }

    /* =================================================================
       BOTTOM NAVIGATION — identik dengan halaman lain
       ================================================================= */
    .bottom-nav-spacer { height: calc(72px + env(safe-area-inset-bottom)); }

    .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0 auto;
        width: 100%;
        max-width: 560px;
        display: flex;
        z-index: 50;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border);
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 2px;
        color: var(--text-secondary);
        border-radius: 12px;
        text-decoration: none;
        transition: color 0.15s ease;
    }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item span { font-size: 10.5px; font-weight: 600; letter-spacing: -0.01em; }
    .nav-item.active { color: var(--primary); }
    .nav-item:active { opacity: 0.7; }
</style>
</head>

 <div class="brand">

                <button class="chip" data-filter="lainnya">Lainnya</button>
            </nav>

            <div class="game-list" id="gameList"></div>
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="10" rx="5"/></svg>
                <p>Belum ada game pada kategori ini.</p>
            </div>

            <button class="load-more" id="loadMoreBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="10" rx="5"/><line x1="7" y1="13" x2="7" y2="13.01"/><line x1="7" y1="10.5" x2="7" y2="15.5"/><line x1="5.5" y1="13" x2="8.5" y2="13"/></svg>
                <span id="loadMoreLabel">Lihat game lainnya</span>
            </button>
        </div>

    </div>

    <!-- ================= SPACER — mencegah konten tertutup bottom navigation ================= -->
    <div class="bottom-nav-spacer"></div>

    <!-- ================= BOTTOM NAVIGATION ================= -->
    <nav class="bottom-nav" aria-label="Navigasi utama">
        <a class="nav-item" href="beranda.html" data-nav="beranda">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
            <span>Beranda</span>
        </a>
        <a class="nav-item" href="topik.html" data-nav="topik">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 16.5h7"/></svg>
            <span>Topik</span>
        </a>
        <a class="nav-item" href="eksplorasi.html" data-nav="eksplorasi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5.5L4.5 18a1.8 1.8 0 0 0 1.6 2.6h11.8A1.8 1.8 0 0 0 19.5 18L14 8.5V3"/><path d="M7.5 14h9"/></svg>
            <span>Eksplorasi</span>
        </a>
        <a class="nav-item active" href="arena.html" data-nav="arena" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="10" rx="5"/><line x1="7" y1="13" x2="7" y2="13.01"/><line x1="7" y1="10.5" x2="7" y2="15.5"/><line x1="5.5" y1="13" x2="8.5" y2="13"/><circle cx="16" cy="11.5" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>
            <span>Arena Game</span>

            <span>Cakrawala</span>
        </a>
    </nav>

</div>

<script>
    /* ================================================================
       ZONA EDIT GURU
       ================================================================

       GURU HANYA PERLU MENGEDIT BAGIAN INI (sampai tulisan
       "JANGAN UBAH KODE DI BAWAH INI").

       1. Tambahkan game baru di GAMES.
       2. Masukkan link game pada bagian link.
       3. Atur game yang ingin ditampilkan sebagai game unggulan
          pada MATERI_AKTIF.
       4. (Opsional) Atur kartu ringkasan platform pada LANJUTKAN.

       JANGAN MENGUBAH KODE DI LUAR ZONA INI.
       ================================================================ */

    // ================================================================
    // CARA MENAMBAHKAN GAME BARU
    // ================================================================
    //
    // 1. Salin satu blok game (dari tanda { sampai tanda }).
    // 2. Tempel di bawah game terakhir.
    // 3. Ganti nama, materi, platform, dan deskripsi.
    // 4. Ganti "TEMPEL LINK GAME DI SINI" dengan link game sebenarnya.
    //
    // Contoh:
    // link: "https://play.blooket.com/..."
    //
    // Platform HARUS salah satu dari: "Blooket", "Kahoot", "ZEP",
    // "Quizizz" — platform lain otomatis masuk kategori "Lainnya"
    // pada filter.
    // ================================================================

    const GAMES = [
        {
            nama: "Akar & Faktor Polinomial",
            materi: "Polinomial",
            platform: "Blooket",
            deskripsi: "Uji pemahamanmu tentang akar dan faktor polinomial melalui kuis seru.",
            link: "TEMPEL LINK GAME DI SINI"
        },
        {
            nama: "Operasi Polinomial",
            materi: "Polinomial",
            platform: "Kahoot",
            deskripsi: "Kuis cepat seputar penjumlahan, pengurangan, dan perkalian polinomial.",
            link: "TEMPEL LINK GAME DI SINI"
        },
        {
            nama: "Sifat-sifat Polinomial",
            materi: "Polinomial",
            platform: "ZEP",
            deskripsi: "Jelajahi dunia ZEP sambil menjawab soal-soal polinomial.",
            link: "TEMPEL LINK GAME DI SINI"
        },
        {
            nama: "Persamaan Lingkaran",
            materi: "Persamaan Lingkaran",
            platform: "Kahoot",
            deskripsi: "Kuis interaktif seputar persamaan lingkaran.",
            link: "TEMPEL LINK GAME DI SINI"
        },
        {
            nama: "Pusat dan Jari-jari",
            materi: "Persamaan Lingkaran",
            platform: "ZEP",
            deskripsi: "Jelajahi konsep pusat dan jari-jari melalui permainan interaktif.",
            link: "TEMPEL LINK GAME DI SINI"
        },
        {
            nama: "Operasi Aljabar",
            materi: "Aljabar",
            platform: "Quizizz",
            deskripsi: "Latihan cepat operasi aljabar.",
            link: "TEMPEL LINK GAME DI SINI"
        },
        {
            nama: "Balapan Matematika",
            materi: "Campuran",
            platform: "Quizizz",
            deskripsi: "Kuis seru yang mencakup berbagai materi matematika.",
            link: "TEMPEL LINK GAME DI SINI"
        }
    ];

    // ================================================================
    // KARTU RINGKASAN "LANJUTKAN" (opsional)
    // ================================================================
    // Cukup daftar platform yang ingin ditonjolkan. Jumlah game
    // ("X game tersedia") dihitung OTOMATIS dari isi GAMES sesuai
    // platform tersebut — tidak perlu diketik manual.
    // ================================================================

    const LANJUTKAN = [
        { platform: "Blooket", link: "TEMPEL LINK GAME DI SINI" },
        { platform: "Kahoot", link: "TEMPEL LINK GAME DI SINI" },
        { platform: "ZEP", link: "TEMPEL LINK GAME DI SINI" }
    ];

    // ================================================================
    // GAME SESUAI MATERI YANG SEDANG DIPELAJARI
    //
    // Ganti bagian ini ketika materi pembelajaran utama berubah.
    // Jumlah game ("X game tersedia") juga dihitung OTOMATIS dari
    // GAMES sesuai nama materi ini — tidak perlu diketik manual.
    //
    // Contoh:
    // materi: "Persamaan Lingkaran"
    // platform: "ZEP"
    // ================================================================

    const MATERI_AKTIF = {
        materi: "Polinomial",
        platform: "Blooket",
        deskripsi: "Uji pemahamanmu tentang polinomial melalui kuis seru!",
        link: "TEMPEL LINK GAME UTAMA DI SINI",
        badge: "Baru"   // kosongkan / hapus baris ini jika tidak perlu badge
    };

    /* ================================================================
       JANGAN UBAH KODE DI BAWAH INI
       (sistem otomatis — filter, hitung jumlah game, render tampilan)
       ================================================================ */

    const PLATFORM_CONFIG = {
        Blooket: { label: "Blooket", color: "#7C3AED", icon: "B" },
        Kahoot:  { label: "Kahoot!", color: "#5B21B6", icon: "K!" },
        ZEP:     { label: "ZEP",     color: "#2563EB", icon: "Z" },
        Quizizz: { label: "Quizizz", color: "#EA580C", icon: "Q" }
    };
    const PLATFORM_DEFAULT = {
        label: "Lainnya",
        color: "#16A34A",
        iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="10" rx="5"/><line x1="7" y1="13" x2="7" y2="13.01"/><line x1="7" y1="10.5" x2="7" y2="15.5"/><line x1="5.5" y1="13" x2="8.5" y2="13"/></svg>'
    };

    function platformConfig(platform){
        return PLATFORM_CONFIG[platform] || PLATFORM_DEFAULT;
    }

    function platformBadgeHTML(platform, size){
        const cfg = platformConfig(platform);
        const inner = cfg.icon ? cfg.icon : cfg.iconSvg;
        return `<div class="${size}" style="background:${cfg.color};">${inner}</div>`;
    }

    const ICON_GAME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="10" rx="5"/><line x1="7" y1="13" x2="7" y2="13.01"/><line x1="7" y1="10.5" x2="7" y2="15.5"/><line x1="5.5" y1="13" x2="8.5" y2="13"/></svg>';
    const ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

    // Validasi link sederhana: jika guru belum mengganti placeholder
    // (atau field link kosong), tombol tetap aman diklik — cukup
    // diarahkan ke "#" tanpa membuka tab baru, tidak ada error apa pun.
    const LINK_PLACEHOLDER_PATTERNS = ['tempel link'];
    function isLinkFilled(link){
        if(!link) return false;
        const clean = link.trim().toLowerCase();
        if(clean === '' || clean === '#') return false;
        return !LINK_PLACEHOLDER_PATTERNS.some(p => clean.includes(p));
    }
    function safeLinkAttrs(link){
        const filled = isLinkFilled(link);
        return {
            href: filled ? link : '#',
            targetRel: filled ? 'target="_blank" rel="noopener"' : ''
        };
    }

    /* ---------------- LANJUTKAN ---------------- */
    function renderLanjutkan(){
        const wrap = document.getElementById('lanjutScroll');
        wrap.innerHTML = '';
        LANJUTKAN.forEach(item => {
            const count = GAMES.filter(g => g.platform === item.platform).length;
            const cfg = platformConfig(item.platform);
            const { href, targetRel } = safeLinkAttrs(item.link);
            const el = document.createElement('a');
            el.className = 'lanjut-card';
            el.href = href;
            if(targetRel){ el.target = '_blank'; el.rel = 'noopener'; }
            el.innerHTML = `
                ${platformBadgeHTML(item.platform, 'lanjut-badge')}
                <div class="lanjut-materi">${cfg.label}</div>
                <div class="lanjut-count">${ICON_GAME} ${count} game tersedia</div>
            `;
            wrap.appendChild(el);
        });
    }

    /* ---------------- GAME SESUAI MATERI AKTIF ---------------- */
    function renderFeatured(){
        const card = document.getElementById('featuredCard');
        const badgeEl = document.getElementById('featuredBadge');
        const count = GAMES.filter(g => g.materi === MATERI_AKTIF.materi).length;
        const cfg = platformConfig(MATERI_AKTIF.platform);

        badgeEl.textContent = MATERI_AKTIF.badge || '';
        badgeEl.style.display = MATERI_AKTIF.badge ? 'inline-block' : 'none';

        const { href, targetRel } = safeLinkAttrs(MATERI_AKTIF.link);
        card.href = href;
        if(targetRel){ card.target = '_blank'; card.rel = 'noopener'; }
        else { card.removeAttribute('target'); card.removeAttribute('rel'); }
        card.innerHTML = `
            <div class="featured-thumb">
                <svg class="featured-thumb-deco" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                    <circle cx="172" cy="26" r="34" fill="none" stroke="#fff" stroke-width="1.4" opacity="0.18"/>
                    <circle cx="150" cy="20" r="3" fill="#fff" opacity="0.35"/>
                    <path d="M20 18 h20 M30 8 v20" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.28"/>
                    <path d="M155 95 l14 14 M169 95 l-14 14" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.22"/>
                    <circle cx="24" cy="110" r="16" fill="none" stroke="#fff" stroke-width="1.4" stroke-dasharray="2 5" opacity="0.3"/>
                    <path d="M96 12 a10 10 0 1 1 0 0.1" fill="none" stroke="#fff" stroke-width="1.4" opacity="0.16"/>
                </svg>
                <span class="featured-thumb-platform">${cfg.icon ? cfg.icon : cfg.iconSvg}</span>
                <span class="featured-thumb-title">${MATERI_AKTIF.materi}</span>
            </div>
            <div class="featured-body">
                <div class="featured-platform">
                    ${platformBadgeHTML(MATERI_AKTIF.platform, 'featured-platform-badge')}
                    ${cfg.label}
                </div>
                <div class="featured-title">${MATERI_AKTIF.materi}</div>
                <p class="featured-desc">${MATERI_AKTIF.deskripsi || ''}</p>
                <div class="featured-footer">
                    <span class="featured-count">${ICON_GAME} ${count} game tersedia</span>
                    <span class="btn-primary">Mainkan ${ICON_ARROW}</span>
                </div>
            </div>
        `;
    }

    /* ---------------- SEMUA GAME & KUIS ---------------- */
    const filtersEl = document.getElementById('filters');
    const listEl = document.getElementById('gameList');
    const emptyEl = document.getElementById('emptyState');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const loadMoreLabel = document.getElementById('loadMoreLabel');

    const PREVIEW_COUNT = 5;
    let kategoriAktif = 'semua';
    let expanded = false;

    function cocokKategori(game){
        if(kategoriAktif === 'semua') return true;
        if(kategoriAktif === 'lainnya') return !PLATFORM_CONFIG[game.platform];
        return game.platform === kategoriAktif;
    }

    function buatBarisGame(item){
        const cfg = platformConfig(item.platform);
        const { href, targetRel } = safeLinkAttrs(item.link);
        const row = document.createElement('div');
        row.className = 'game-row';
        row.innerHTML = `
            ${platformBadgeHTML(item.platform, 'game-badge')}
            <div class="game-info">
                <div class="game-name">${item.nama}</div>
                <div class="game-meta">${cfg.label}<span class="dot"></span>${item.materi}</div>
            </div>
            <a class="btn-outline" href="${href}" ${targetRel}>Mainkan</a>
        `;
        return row;
    }

    function renderGameList(){
        const data = GAMES.filter(cocokKategori);
        listEl.innerHTML = '';

        if(data.length === 0){
            emptyEl.classList.add('show');
            loadMoreBtn.style.display = 'none';
            return;
        }
        emptyEl.classList.remove('show');

        const shown = expanded ? data : data.slice(0, PREVIEW_COUNT);
        shown.forEach(item => listEl.appendChild(buatBarisGame(item)));

        if(data.length > PREVIEW_COUNT){
            loadMoreBtn.style.display = 'flex';
            loadMoreBtn.classList.toggle('expanded', expanded);
            loadMoreLabel.textContent = expanded ? 'Tampilkan lebih sedikit' : 'Lihat game lainnya';
        } else {
            loadMoreBtn.style.display = 'none';
        }
    }

    filtersEl.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if(!chip) return;
        filtersEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        kategoriAktif = chip.dataset.filter;
        expanded = false;
        renderGameList();
    });

    loadMoreBtn.addEventListener('click', () => {
        expanded = !expanded;
        renderGameList();
    });

    /* ---------------- "Lihat semua" pada Lanjutkan -> scroll ke Semua Game ---------------- */
    document.querySelector('[data-nav-target="semua-game"]').addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('semua-game').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    /* ---------------- INISIALISASI ---------------- */
    renderLanjutkan();
    renderFeatured();
    renderGameList();
</script>

</body>
