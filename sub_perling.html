<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persamaan Lingkaran | Numera</title>

<!--
    =====================================================================
    NUMERA — TEMPLATE HALAMAN DETAIL TOPIK (LANDING PAGE BAB)
    =====================================================================
    Ini adalah file MASTER / TEMPLATE.

    Halaman ini BUKAN daftar isi biasa — ini landing page untuk satu bab,
    supaya siswa merasa "memasuki" satu bab pembelajaran yang utuh
    sebelum memilih subbab yang ingin dipelajari.

    File ini dipakai untuk SEMUA halaman topik (polinomial.html,
    limit.html, statistika.html, peluang.html, dst).

    CARA MEMAKAI UNTUK TOPIK BARU
    -------------------------------
    1. Duplikat/copy file ini, ganti namanya sesuai topik.
       Contoh: limit.html, statistika.html
    2. Ubah <title> di atas.
    3. Ubah object TOPIK_INFO di bagian <script> (nama, ikon, deskripsi).
    4. Ubah array KOMPETENSI — daftar poin capaian bab ini.
    5. Ubah array SUBMODUL — isi dengan subbab beserta link halaman
       materinya masing-masing.
    6. Simpan & upload ke GitHub Pages.

    TIDAK PERLU mengubah HTML atau CSS sama sekali — cukup tiga
    bagian data di <script> (TOPIK_INFO, KOMPETENSI, SUBMODUL).

    Tombol "← Topik Pembelajaran" selalu mengarah ke topik.html,
    jadi biarkan href itu apa adanya di semua salinan file ini.

    Warna di seluruh halaman ini SERAGAM primary (#2563EB) untuk
    semua topik — perbedaan identitas antar bab cukup dari emoji,
    judul, dan deskripsi, bukan dari warna tema yang berbeda-beda.
    =====================================================================
-->

<style>
    /* =================================================================
       RESET & DASAR (identik dengan topik.html agar konsisten)
       ================================================================= */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #2563EB;
        --primary-soft: #EFF6FF;
        --primary-soft-2: #DBEAFE;
        --bg: #F8FAFC;
        --card: #FFFFFF;
        --border: #E2E8F0;
        --text: #0F172A;
        --text-secondary: #64748B;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
    }

    .container {
        max-width: 880px;
        margin: 0 auto;
        padding: 0 20px 64px;
    }

    /* =================================================================
       BREADCRUMB / BACK LINK
       ================================================================= */
    .back-link-wrap {
        padding: 18px 0 0;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 500;
        padding: 6px 0;
        transition: color 0.2s ease;
    }

    .back-link:hover {
        color: var(--primary);
    }

    /* =================================================================
       HERO SECTION
       ================================================================= */
    .hero {
        position: relative;
        text-align: center;
        padding: 28px 20px 40px;
        overflow: hidden;
        animation: fadeInUp 0.5s ease both;
    }

    /* dekorasi blob — murni CSS, tidak ada gambar/aset eksternal */
    .hero-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
        z-index: 0;
        pointer-events: none;
    }

    .hero-blob-1 {
        width: 240px;
        height: 240px;
        background: var(--primary-soft-2);
        top: -80px;
        left: 50%;
        transform: translateX(-60%);
        opacity: 0.8;
    }

    .hero-blob-2 {
        width: 180px;
        height: 180px;
        background: var(--primary-soft);
        top: -20px;
        left: 50%;
        transform: translateX(20%);
        opacity: 0.9;
    }

    .hero-content {
        position: relative;
        z-index: 1;
    }

    .hero-icon {
        width: 88px;
        height: 88px;
        margin: 0 auto 18px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
    }

    .hero-title {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
        color: var(--text);
    }

    .hero-desc {
        max-width: 520px;
        margin: 0 auto;
        font-size: 15px;
        color: var(--text-secondary);
        line-height: 1.65;
    }

    /* =================================================================
       KOMPETENSI
       ================================================================= */
    .kompetensi-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px 24px;
        margin-bottom: 28px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        animation: fadeInUp 0.5s ease 0.05s both;
    }

    .kompetensi-header {
        margin-bottom: 14px;
    }

    .kompetensi-header h2 {
        font-size: 15.5px;
        font-weight: 700;
        margin-bottom: 3px;
    }

    .kompetensi-header p {
        font-size: 12.5px;
        color: var(--text-secondary);
    }

    .kompetensi-list {
        list-style: none;
    }

    .kompetensi-list li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 14px;
        color: var(--text);
        padding: 7px 0;
    }

    .kompetensi-list li::before {
        content: "✓";
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--primary-soft-2);
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1px;
    }

    /* =================================================================
       DAFTAR SUBBAB
       ================================================================= */
    .subbab-heading {
        font-size: 15.5px;
        font-weight: 700;
        margin-bottom: 14px;
        animation: fadeInUp 0.5s ease 0.08s both;
    }

    .submodul-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* seluruh card adalah tombol — tidak ada tombol "Masuk" terpisah,
       supaya area sentuh besar dan nyaman di mobile */
    .submodul-card {
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px 20px;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        animation: fadeInUp 0.45s ease both;
    }

    .submodul-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        border-color: var(--primary-soft-2);
    }

    .submodul-card:active {
        transform: translateY(-1px);
    }

    /* nomor urut — dipertahankan karena subbab memang urutan belajar nyata */
    .submodul-nomor {
        flex-shrink: 0;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        color: var(--primary);
        background: var(--primary-soft);
    }

    .submodul-icon {
        flex-shrink: 0;
        font-size: 22px;
        width: 32px;
        text-align: center;
    }

    .submodul-body {
        flex: 1;
        min-width: 0;
    }

    .submodul-judul {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 2px;
        letter-spacing: -0.01em;
    }

    .submodul-deskripsi {
        font-size: 13px;
        color: var(--text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .submodul-arrow {
        flex-shrink: 0;
        font-size: 18px;
        color: var(--text-secondary);
        transition: transform 0.2s ease, color 0.2s ease;
    }

    .submodul-card:hover .submodul-arrow {
        transform: translateX(4px);
        color: var(--primary);
    }

    .submodul-card:nth-child(1) { animation-delay: 0.1s; }
    .submodul-card:nth-child(2) { animation-delay: 0.14s; }
    .submodul-card:nth-child(3) { animation-delay: 0.18s; }
    .submodul-card:nth-child(4) { animation-delay: 0.22s; }
    .submodul-card:nth-child(5) { animation-delay: 0.26s; }
    .submodul-card:nth-child(n+6) { animation-delay: 0.3s; }

    /* =================================================================
       FOOTER
       ================================================================= */
    footer {
        text-align: center;
        padding: 28px 20px 36px;
        font-size: 13px;
        color: var(--text-secondary);
        border-top: 1px solid var(--border);
        margin-top: 12px;
    }

    /* =================================================================
       ANIMASI
       ================================================================= */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        * {
            animation: none !important;
            transition: none !important;
        }
    }

    /* =================================================================
       RESPONSIF — desktop sedikit lebih lega
       ================================================================= */
    @media (min-width: 640px) {
        .hero {
            padding: 40px 20px 48px;
        }

        .hero-title {
            font-size: 34px;
        }
    }
</style>
</head>
<body>

    <div class="container">

        <!-- ================= BREADCRUMB ================= -->
        <div class="back-link-wrap">
            <a class="back-link" href="topik.html">← Topik Pembelajaran</a>
        </div>

        <!-- ================= HERO (isi otomatis dari TOPIK_INFO) ================= -->
        <div class="hero">
            <div class="hero-blob hero-blob-1"></div>
            <div class="hero-blob hero-blob-2"></div>
            <div class="hero-content">
                <div class="hero-icon" id="heroIcon"></div>
                <h1 class="hero-title" id="heroTitle"></h1>
                <p class="hero-desc" id="heroDesc"></p>
            </div>
        </div>

        <!-- ================= KOMPETENSI (diisi otomatis dari array KOMPETENSI) ================= -->
        <div class="kompetensi-card">
            <div class="kompetensi-header">
                <h2>🎯 Nanti Kamu Akan Bisa Apa?</h2>
                <p>Gambaran umum bab ini, bukan materi lengkap.</p>
            </div>
            <ul class="kompetensi-list" id="kompetensiList"></ul>
        </div>

        <!-- ================= DAFTAR SUBBAB ================= -->
        <h2 class="subbab-heading">Subbab dalam bab ini</h2>
        <div class="submodul-list" id="submodulList"></div>

    </div>

    <!-- ================= FOOTER ================= -->
    <footer>
        Numera
    </footer>

    <script>
        /* =============================================================
           DATA TOPIK — GANTI BAGIAN INI UNTUK SETIAP TOPIK BARU
           ============================================================= */
        const TOPIK_INFO = {
            nama: "Persamaan Lingkaran",
            ikon: "🟢",
            deskripsi: "Pelajari cara memahami dan menentukan persamaan lingkaran, mulai dari pusat dan jari-jari hingga kedudukan titik dan garis terhadap lingkaran."
        };

        /* =============================================================
           DATA KOMPETENSI — GANTI BAGIAN INI UNTUK SETIAP TOPIK BARU
           -------------------------------------------------------------
           Setiap baris adalah satu poin capaian belajar, ditampilkan
           sebagai checklist. Cukup daftar teks (string), tanpa struktur
           tambahan.
           ============================================================= */
        const KOMPETENSI = [
            "Mengenali seperti apa persamaan sebuah lingkaran.",
            "Menemukan pusat dan jari-jari dari persamaannya.",
            "Mengecek posisi sebuah titik atau garis terhadap lingkaran.",
            "Membuat persamaan lingkaran dari informasi yang diberikan."
        ];

        /* =============================================================
           DATA SUBBAB — GANTI BAGIAN INI UNTUK SETIAP TOPIK BARU
           -------------------------------------------------------------
           Setiap object subbab memiliki:
             judul      : nama subbab (string)
             ikon       : emoji kecil untuk subbab ini (string)
             deskripsi  : deskripsi singkat, 1 kalimat (string)
             link       : file/halaman materi tujuan saat diklik (string)

           Nomor urut ditampilkan otomatis sesuai urutan array —
           susun dari atas ke bawah sesuai urutan belajar yang dianjurkan.
           ============================================================= */
        const SUBMODUL = [
            {
                judul: "Definisi & Unsur",
                ikon: "🟢",
                deskripsi: "Mengenal pusat, jari-jari, dan unsur penting lingkaran.",
                link: "persamaan_lingkaran_definisi.html"
            },
            {
                judul: "Pusat O(0, 0)",
                ikon: "⚫",
                deskripsi: "Mengenal persamaan lingkaran yang berpusat di titik asal.",
                link: "persamaan_lingkaran_o.html"
            },
            {
                judul: "Pusat P(a, b)",
                ikon: "⚪",
                deskripsi: "Menentukan persamaan lingkaran dari pusat dan jari-jarinya.",
                link: "persamaan_lingkaran_pab.html"
            },
            {
                judul: "Bentuk Umum",
                ikon: "🔴",
                deskripsi: "Mengenali bentuk umum persamaan lingkaran dan hubungannya dengan pusat.",
                link: "persamaan_lingkaran_bu.html"
            },
            {
                judul: "Pusat & Jari-Jari",
                ikon: "🔵",
                deskripsi: "Menemukan pusat dan jari-jari dari bentuk umum persamaan lingkaran.",
                link: "persamaan_lingkaran_pusatjari.html"
            },
            {
                judul: "Kedudukan Titik",
                ikon: "🟠",
                deskripsi: "Menentukan posisi sebuah titik terhadap lingkaran.",
                link: "kedudukan_titik_lingkaran.html"
            },
            {
                judul: "Kedudukan Garis",
                ikon: "🟡",
                deskripsi: "Menentukan posisi garis terhadap lingkaran.",
                link: "persamaan_lingkaran_kedudukan_garis.html"
            },  
            {
                judul: "Persamaan Garis Singgung",
                ikon: "🟣",
                deskripsi: "Menentukan persamaan garis yang menyinggung lingkaran.",
                link: "persamaan_lingkaran_pgs.html"
            },    
            {
                judul: "Hubungan Dua Lingkaran",
                ikon: "🟤",
                deskripsi: "Mengetahui posisi dua lingkaran berdasarkan pusat dan jari-jarinya.",
                link: "persamaan_lingkaran_hubungan_dua.html"
            }

            // Tambahkan subbab baru di sini, contoh:
            // {
            //     judul: "Latihan Soal Polinomial",
            //     ikon: "📝",
            //     deskripsi: "Kumpulan soal dan pembahasan bab ini.",
            //     link: "polinomial-latihan.html"
            // },
        ];

        /* =============================================================
           RENDER HERO
           ============================================================= */
        document.getElementById("heroIcon").textContent = TOPIK_INFO.ikon;
        document.getElementById("heroTitle").textContent = TOPIK_INFO.nama;
        document.getElementById("heroDesc").textContent = TOPIK_INFO.deskripsi;
        document.title = `${TOPIK_INFO.nama} | Numera`;

        /* =============================================================
           RENDER KOMPETENSI
           ============================================================= */
        const kompetensiListEl = document.getElementById("kompetensiList");

        KOMPETENSI.forEach(poin => {
            const li = document.createElement("li");
            li.textContent = poin;
            kompetensiListEl.appendChild(li);
        });

        /* =============================================================
           RENDER DAFTAR SUBBAB
           ============================================================= */
        const submodulListEl = document.getElementById("submodulList");

        SUBMODUL.forEach((sub, index) => {
            const card = document.createElement("a");
            card.className = "submodul-card";
            card.href = sub.link;

            card.innerHTML = `
                <div class="submodul-nomor">${index + 1}</div>
                <div class="submodul-icon">${sub.ikon}</div>
                <div class="submodul-body">
                    <div class="submodul-judul">${sub.judul}</div>
                    <div class="submodul-deskripsi">${sub.deskripsi}</div>
                </div>
                <div class="submodul-arrow">›</div>
            `;

            submodulListEl.appendChild(card);
        });
    </script>

</body>
</html>
