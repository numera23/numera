<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pengumuman · Cakrawala Matematika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --primary:#2563EB;
    --primary-hover:#1D4ED8;
    --primary-light:#DBEAFE;
    --bg:#F8FAFC;
    --card:#FFFFFF;
    --text:#0F172A;
    --text-secondary:#64748B;
    --border:#E2E8F0;
    --success:#10B981;
    --warning:#F59E0B;
    --error:#EF4444;
    --agenda:#7C3AED;
    --agenda-light:#EDE9FE;
    --radius-card:18px;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}

  /* =================================================================
     APP SHELL — canvas mobile
     Konsisten dengan topik.html / eksplorasi.html: di PC/laptop
     konten tetap sempit di tengah, tidak melebar memenuhi monitor.
     ================================================================= */
  .app-shell{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
  }
  @media (min-width:561px){
    .app-shell{border-left:1px solid var(--border);border-right:1px solid var(--border);}
  }

  .container{
    padding:24px 20px 8px;
  }

  /* =================================================================
     HEADER
     ================================================================= */
  .page-head{
    display:flex;
    align-items:flex-start;
    gap:14px;
    margin-bottom:22px;
  }
  .page-head-icon{
    flex-shrink:0;
    width:52px;
    height:52px;
    border-radius:15px;
    background:var(--primary-light);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .page-head-icon svg{width:26px;height:26px;color:var(--primary);}
  .page-head h1{
    font-size:25px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:2px 0 5px;
    line-height:1.1;
  }
  .page-head p{
    font-size:13.5px;
    color:var(--text-secondary);
    margin:0;
    line-height:1.45;
  }

  /* =================================================================
     FILTER PILL
     ================================================================= */
  .filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:20px;
    margin-bottom:2px;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    font-size:13.5px;
    font-weight:600;
    color:var(--text-secondary);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip svg{width:15px;height:15px;flex-shrink:0;}
  .chip:active{transform:scale(0.96);}
  .chip.active{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
    box-shadow:0 4px 10px rgba(37,99,235,0.22);
  }

  /* =================================================================
     LIST + CARD
     ================================================================= */
  main{padding:0 20px 8px;}

  .list{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .p-card{
    display:flex;
    gap:14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow);
    padding:18px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .p-card.show{opacity:1;transform:translateY(0);}

  .p-icon{
    flex-shrink:0;
    width:46px;
    height:46px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .p-icon svg{width:22px;height:22px;}

  .p-body{flex:1;min-width:0;}

  .p-top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
  }
  .p-kategori{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .p-tanggal{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    font-weight:500;
    color:var(--text-secondary);
    white-space:nowrap;
  }
  .p-tanggal .dot{
    width:6px;height:6px;border-radius:50%;flex-shrink:0;
  }

  .p-judul{
    font-size:15.5px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0 0 4px;
    line-height:1.3;
  }
  .p-deskripsi{
    font-size:13.5px;
    color:var(--text-secondary);
    line-height:1.5;
    margin:0;
  }

  .p-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:10px;
    font-size:13.5px;
    font-weight:700;
    color:var(--primary);
  }
  .p-link svg{width:14px;height:14px;transition:transform .15s ease;}
  .p-card:active .p-link svg{transform:translateX(2px);}

  /* =================================================================
     EMPTY STATE
     ================================================================= */
  .empty-state{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:64px 30px;
    color:var(--text-secondary);
  }
  .empty-state svg{width:56px;height:56px;margin-bottom:14px;color:#CBD5E1;}
  .empty-state p{font-size:13.5px;margin:0;}
  .empty-state.show{display:flex;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  /* =================================================================
     BOTTOM NAVIGATION
     Standar navigasi utama Cakrawala Matematika: 5 menu, fixed di
     bawah, lebar mengikuti canvas mobile (tidak melebar di PC/laptop).
     Identik dengan bottom navigation pada topik.html / eksplorasi.html.
     ================================================================= */
  .bottom-nav-spacer{
    height:calc(72px + env(safe-area-inset-bottom));
  }

  .bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    margin:0 auto;
    width:100%;
    max-width:560px;
    display:flex;
    z-index:50;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--border);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }

  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:6px 2px;
    color:var(--text-secondary);
    border-radius:12px;
    transition:color .15s ease;
  }
  .nav-item svg{width:22px;height:22px;}
  .nav-item span{font-size:10.5px;font-weight:600;letter-spacing:-0.01em;}
  .nav-item.active{color:var(--primary);}
  .nav-item:active{opacity:0.7;}
</style>
</head>
<body>

<div class="app-shell">

  <div class="container">
    <!-- ================= HEADER ================= -->
    <div class="page-head">
      <div class="page-head-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 0 0 2 2h1l3 5 1-5h2l7 4V6l-7 4H6a2 2 0 0 0-2 2Z"/><path d="M11 10V6"/></svg>
      </div>
      <div>
        <h1>Pengumuman</h1>
        <p>Informasi penting seputar pembelajaran matematika.</p>
      </div>
    </div>

    <!-- ================= FILTER KATEGORI ================= -->
    <nav class="filters" id="filters">
      <button class="chip active" data-filter="semua">Semua</button>
      <button class="chip" data-filter="deadline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        Deadline
      </button>
      <button class="chip" data-filter="materi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5Z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5Z"/></svg>
        Materi
      </button>
      <button class="chip" data-filter="ulangan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v3.5L5 18a1.6 1.6 0 0 0 1.5 2.2h11a1.6 1.6 0 0 0 1.5-2.2L14 6.5V3"/><path d="M8 15h8"/></svg>
        Ulangan
      </button>
      <button class="chip" data-filter="agenda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/><path d="M8.5 14l2 2 4-4"/></svg>
        Agenda
      </button>
    </nav>
  </div>

  <!-- ================= DAFTAR PENGUMUMAN (diisi otomatis lewat JS) ================= -->
  <main>
    <div class="list" id="pengumumanList"></div>
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>
      <p>Belum ada pengumuman pada kategori ini.</p>
    </div>
  </main>

  <div class="bottom-nav-spacer"></div>

  <!-- ================= BOTTOM NAVIGATION ================= -->
  <!-- Struktur navigasi utama Cakrawala Matematika (5 menu). -->
  <!-- Ganti atribut href pada tiap <a> sesuai halaman tujuan. -->
  <!-- Catatan: halaman Pengumuman belum punya menu khusus di bottom
       navigation, sehingga untuk saat ini tidak ada menu yang ditandai
       aktif. Jika nanti Pengumuman ditetapkan sebagai bagian dari salah
       satu menu (misalnya Topik), tambahkan class="nav-item active"
       dan aria-current="page" pada menu tersebut. -->
  <nav class="bottom-nav" aria-label="Navigasi utama">
    <!-- GANTI href di bawah ini ke halaman Beranda yang sebenarnya -->
    <a class="nav-item" href="#" data-nav="beranda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
      <span>Beranda</span>
    </a>
    <!-- GANTI href di bawah ini ke halaman Topik yang sebenarnya -->
    <a class="nav-item" href="topik.html" data-nav="topik">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 16.5h7"/></svg>
      <span>Topik</span>
    </a>
    <!-- GANTI href di bawah ini ke halaman Eksplorasi yang sebenarnya -->
    <a class="nav-item" href="eksplorasi.html" data-nav="eksplorasi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5.5L4.5 18a1.8 1.8 0 0 0 1.6 2.6h11.8A1.8 1.8 0 0 0 19.5 18L14 8.5V3"/><path d="M7.5 14h9"/></svg>
      <span>Eksplorasi</span>
    </a>
    <!-- GANTI href di bawah ini ke halaman Arena Game yang sebenarnya -->
    <a class="nav-item" href="arena.html" data-nav="arena">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="10" rx="5"/><line x1="7" y1="13" x2="7" y2="13.01"/><line x1="7" y1="10.5" x2="7" y2="15.5"/><line x1="5.5" y1="13" x2="8.5" y2="13"/><circle cx="16" cy="11.5" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>
      <span>Arena Game</span>
    </a>
    <!-- GANTI href di bawah ini ke halaman Cakrawala yang sebenarnya -->
    <a class="nav-item" href="cakrawala.html" data-nav="Cakrawala">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5-6-3.5Z"/></svg>
      <span>Cakrawala</span>
    </a>
  </nav>

</div>

<script>
/* ==========================================================================
   ZONA EDIT — GURU HANYA MENGUBAH BAGIAN DI BAWAH INI SAMPAI TULISAN
   "AKHIR ZONA EDIT". JANGAN UBAH KODE DI LUAR AREA INI.

   CARA MENAMBAH PENGUMUMAN BARU:
   1. Salin satu blok { ... } di bawah ini (termasuk koma di akhir blok).
   2. Tempel di posisi yang kamu mau di dalam DATA_PENGUMUMAN.
      Paling atas = tampil paling atas di halaman.
   3. Ganti teks di dalam tanda kutip " " sesuai kebutuhan.

   CARA MENGHAPUS PENGUMUMAN:
   Hapus satu blok { ... } beserta koma setelahnya.

   PILIHAN kategori yang tersedia (tulis persis salah satu dari ini):
     "deadline"  -> Deadline (merah/coral)
     "materi"    -> Materi   (biru)
     "ulangan"   -> Ulangan  (oranye)
     "agenda"    -> Agenda   (ungu)

   DUA TIPE CARD:
   - Isi field "link" dengan alamat tujuan (mis. "modul-1.html") dan
     "labelLink" dengan teks tombolnya (mis. "Buka modul") jika
     pengumuman ini perlu mengarahkan siswa membuka sesuatu.
     Card otomatis menampilkan panah.
   - Hapus / kosongkan field "link" (atau hapus barisnya) jika
     pengumuman ini cukup dibaca saja, tanpa tujuan apa pun.
     Card otomatis TIDAK menampilkan panah maupun tombol.
   ========================================================================== */

const DATA_PENGUMUMAN = [
  {
    kategori: "materi",
    judul: "Modul Persamaan Lingkaran",
    tanggal: "8 Agustus 2026",
    deskripsi: "Modul 1 Persamaan Lingkaran sudah tersedia. Pelajari materi sebelum pertemuan berikutnya.",
    link: "modul-persamaan-lingkaran.html",
    labelLink: "Buka modul"
  },
  {
    kategori: "deadline",
    judul: "Pengumpulan Latihan Polinomial",
    tanggal: "9 Agustus 2026",
    deskripsi: "Kumpulkan latihan Polinomial paling lambat Jumat pukul 23.59 lewat tombol di halaman modul.",
    link: "latihan-polinomial.html",
    labelLink: "Lihat tugas"
  },
  {
    kategori: "ulangan",
    judul: "Ulangan Harian Polinomial",
    tanggal: "14 Agustus 2026",
    deskripsi: "Materi mencakup pembagian polinomial, Teorema Sisa, dan Teorema Faktor."
    // Tidak ada "link" -> card ini tampil sebagai info saja, tanpa panah.
  },
  {
    kategori: "agenda",
    judul: "Pembahasan Latihan Bab 1",
    tanggal: "15 Agustus 2026",
    deskripsi: "Sesi pembahasan latihan Polinomial Bab 1 dilaksanakan bersama di kelas.",
    link: "agenda-pembahasan.html",
    labelLink: "Lihat agenda"
  },
  {
    kategori: "agenda",
    judul: "Perubahan Jadwal Kelas",
    tanggal: "16 Agustus 2026",
    deskripsi: "Mulai minggu depan, jadwal pelajaran matematika berpindah ke jam ke-5."
    // Tidak ada "link" -> card ini tampil sebagai info saja, tanpa panah.
  }
];

/* ==========================================================================
   AKHIR ZONA EDIT — jangan ubah kode di bawah ini.
   ========================================================================== */

const KATEGORI_CONFIG = {
  deadline: {
    label: "Deadline",
    color: "#EF4444",
    bg: "rgba(239,68,68,0.10)",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>`
  },
  materi: {
    label: "Materi",
    color: "#2563EB",
    bg: "#DBEAFE",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5Z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5Z"/></svg>`
  },
  ulangan: {
    label: "Ulangan",
    color: "#F59E0B",
    bg: "rgba(245,158,11,0.12)",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v3.5L5 18a1.6 1.6 0 0 0 1.5 2.2h11a1.6 1.6 0 0 0 1.5-2.2L14 6.5V3"/><path d="M8 15h8"/></svg>`
  },
  agenda: {
    label: "Agenda",
    color: "#7C3AED",
    bg: "#EDE9FE",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/><path d="M8.5 14l2 2 4-4"/></svg>`
  }
};

const listEl = document.getElementById('pengumumanList');
const emptyStateEl = document.getElementById('emptyState');
const filtersEl = document.getElementById('filters');

let kategoriAktif = 'semua';

function buatCard(item){
  const cfg = KATEGORI_CONFIG[item.kategori];
  if(!cfg) return null; // kategori tidak dikenali, lewati

  const isLink = !!item.link;
  const Tag = isLink ? 'a' : 'div';

  const card = document.createElement(Tag);
  card.className = 'p-card';
  if(isLink){
    card.href = item.link;
  }

  card.innerHTML = `
    <div class="p-icon" style="background:${cfg.bg}; color:${cfg.color};">${cfg.icon}</div>
    <div class="p-body">
      <div class="p-top-row">
        <span class="p-kategori" style="color:${cfg.color};">${cfg.label}</span>
        <span class="p-tanggal"><span class="dot" style="background:${cfg.color};"></span>${item.tanggal || ''}</span>
      </div>
      <h3 class="p-judul">${item.judul || ''}</h3>
      <p class="p-deskripsi">${item.deskripsi || ''}</p>
      ${isLink ? `
        <span class="p-link">
          ${item.labelLink || 'Lihat detail'}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </span>` : ''}
    </div>
  `;

  return card;
}

function render(){
  listEl.innerHTML = '';

  const data = kategoriAktif === 'semua'
    ? DATA_PENGUMUMAN
    : DATA_PENGUMUMAN.filter(item => item.kategori === kategoriAktif);

  if(data.length === 0){
    emptyStateEl.classList.add('show');
    return;
  }
  emptyStateEl.classList.remove('show');

  data.forEach(item => {
    const card = buatCard(item);
    if(card) listEl.appendChild(card);
  });

  requestAnimationFrame(() => {
    document.querySelectorAll('.p-card').forEach((el, i) => {
      setTimeout(() => el.classList.add('show'), i * 60);
    });
  });
}

filtersEl.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  filtersEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  kategoriAktif = chip.dataset.filter;
  render();
});

render();
</script>

</body>
</html>
