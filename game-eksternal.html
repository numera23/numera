<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aktivitas Kelas | Numera</title>

<!--
    =====================================================================
    NUMERA — game-eksternal.html
    =====================================================================
    (Nama file sengaja TIDAK diubah agar tidak merusak link yang sudah
    ada, tetapi halaman ini sekarang menampilkan AKTIVITAS KELAS —
    kegiatan yang dimainkan bersama guru & siswa langsung di kelas,
    bukan game/kuis digital yang dimainkan sendiri lewat HP.)

    Halaman daftar LENGKAP Aktivitas Kelas (Four Corners, Swim or
    Sink, dll). Diakses lewat tombol "Lihat aktivitas lainnya" pada
    section "Aktivitas Kelas" di arena.html.

    Data aktivitas (array GAMES) TIDAK didefinisikan di sini — diambil
    dari data-games.js (satu sumber data untuk arena.html,
    game-numera.html, dan game-eksternal.html). Untuk menambah/
    mengubah aktivitas, edit data-games.js — halaman ini otomatis ikut
    ter-update, tanpa perlu mengedit HTML apa pun.

    Header dan bottom navigation sengaja dibuat identik/konsisten
    dengan arena.html supaya terasa satu kesatuan.
    =====================================================================
-->

<style>
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(150deg,var(--primary),var(--primary-hover));
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  box-shadow:0 4px 10px rgba(37,99,235,0.28);
}

.brand-name{
  font-weight:800;
  font-size:14px;
  line-height:1.18;
  letter-spacing:-0.01em;
}   
   * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --primary: #2563EB;
        --primary-hover: #1D4ED8;
        --primary-light: #DBEAFE;
        --bg: #F8FAFC;
        --card: #FFFFFF;
        --border: #E5E7EB;
        --text: #0F172A;
        --text-secondary: #64748B;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; }

    /* =================================================================
       APP SHELL — canvas mobile (konsisten dengan halaman lain)
       ================================================================= */
    .app-shell {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
        position: relative;
    }

    @media (min-width: 561px) {
        .app-shell {
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
    }

    .container { padding: 0 20px 8px; }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
    }

    /* =================================================================
       HEADER
       ================================================================= */
    .app-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 20px 20px 4px;
    }

    .icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        color: var(--text-secondary);
        background: var(--card);
        border: 1px solid var(--border);
        cursor: pointer;
        flex-shrink: 0;
        transition: border-color 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* =================================================================
       HERO — ringkas
       ================================================================= */
    .hero {
        position: relative;
        margin: 12px 0 24px;
        padding: 14px 16px;
        border-radius: 16px;
        overflow: hidden;
        background: linear-gradient(155deg, #EFF4FF 0%, #F8FAFC 65%);
        border: 1px solid var(--border);
        animation: fadeInUp 0.5s ease both;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .hero-text { position: relative; z-index: 1; flex: 1; min-width: 0; }

    .hero-text h2 {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.25;
        color: var(--text);
        margin-bottom: 3px;
    }

    .hero-text p {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.4;
    }

    .hero-visual {
        position: relative;
        z-index: 1;
        width: 46px;
        height: 46px;
        flex-shrink: 0;
        border-radius: 13px;
        background: linear-gradient(150deg, var(--primary), var(--primary-hover));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 14px rgba(37,99,235,0.25);
    }
    .hero-visual svg { width: 24px; height: 24px; }

    /* =================================================================
       SECTION HEADING (dipakai berulang)
       ================================================================= */
    .section { margin-bottom: 26px; animation: fadeInUp 0.5s ease both; }

    .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        gap: 10px;
    }

    .section-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.03em;
        color: var(--text);
        text-transform: uppercase;
    }

    .section-title svg { width: 16px; height: 16px; color: var(--primary); }

    .section-sub {
        font-size: 12.5px;
        color: var(--text-secondary);
        line-height: 1.45;
        margin: -6px 0 14px;
        max-width: 46ch;
    }

    .search-box {
        position: relative;
        margin-bottom: 14px;
    }
    .search-box svg {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--text-secondary);
        pointer-events: none;
    }
    .search-box input {
        width: 100%;
        padding: 11px 14px 11px 38px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        font-size: 13.5px;
        font-family: inherit;
        color: var(--text);
        outline: none;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-box input::placeholder { color: var(--text-secondary); }
    .search-box .clear-btn {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--border);
        color: var(--text-secondary);
        display: none;
        align-items: center;
        justify-content: center;
    }
    .search-box .clear-btn svg { position: static; width: 11px; height: 11px; color: inherit; }
    .search-box.has-text .clear-btn { display: flex; }

    /* =================================================================
       GAME BUATAN NUMERA — list vertikal dengan thumbnail (tanpa scroll)
       ================================================================= */
    .numera-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .numera-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px;
        box-shadow: 0 1px 2px rgba(15,23,42,0.03);
    }

    .numera-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
    }

    .numera-thumb {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 12px;
        overflow: hidden;
        flex-shrink: 0;
        background: #F1F5F9;
    }
    .numera-thumb-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .numera-thumb-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .numera-thumb-emoji { font-size: 22px; }

    .numera-thumb-badge {
        position: absolute;
        top: 4px;
        left: 4px;
        font-size: 9px;
        font-weight: 700;
        color: #16A34A;
        background: #F0FDF4;
        border: 1px solid #DCFCE7;
        padding: 1px 6px;
        border-radius: 999px;
        line-height: 1.5;
    }

    .numera-info { flex: 1; min-width: 0; }

    .numera-meta {
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 4px 5px;
        margin-bottom: 3px;
    }
    .numera-tag-original {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: var(--primary);
        text-transform: uppercase;
        white-space: nowrap;
    }
    .numera-meta .dot {
        width: 3px; height: 3px; border-radius: 50%;
        background: var(--text-secondary); flex-shrink: 0;
    }
    .numera-meta-materi {
        font-size: 11px;
        color: var(--text-secondary);
        flex: 1;
        min-width: 0;
        white-space: normal;
        word-break: break-word;
        line-height: 1.3;
    }

    .numera-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
        line-height: 1.3;
        margin-bottom: 3px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .numera-desc {
        font-size: 11.5px;
        color: var(--text-secondary);
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .numera-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: -2px;
    }
    .numera-play-btn {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(150deg, var(--primary), var(--primary-hover));
        padding: 5px 11px;
        border-radius: 999px;
        box-shadow: 0 3px 7px rgba(37,99,235,0.2);
    }
    .numera-play-btn svg { width: 10px; height: 10px; }

    .numera-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 28px 20px;
        color: var(--text-secondary);
        background: var(--card);
        border: 1px dashed var(--border);
        border-radius: 16px;
        font-size: 13px;
    }

    .btn-lihat-semua {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        width: 100%;
        margin-top: 12px;
        padding: 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--primary);
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
    }
    .btn-lihat-semua svg { width: 14px; height: 14px; transition: transform 0.15s ease; }
    .btn-lihat-semua.expanded svg { transform: rotate(90deg); }

    .numera-full {
        margin-top: 14px;
        padding-top: 16px;
        border-top: 1px dashed var(--border);
    }
    .numera-full[hidden] { display: none; }
    .numera-full-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 10px;
    }

    /* =================================================================
       SEMUA GAME & KUIS — filter (wrap, bukan scroll) + list
       ================================================================= */
    .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-bottom: 14px;
    }

    .chip {
        flex-shrink: 0;
        padding: 8px 15px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s ease;
    }
    .chip:active { transform: scale(0.96); }
    .chip.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
        box-shadow: 0 4px 10px rgba(37,99,235,0.2);
    }

    .game-list {
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(15,23,42,0.03);
    }

    .game-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        border-bottom: 1px solid var(--border);
    }
    .game-row:last-child { border-bottom: none; }

    .game-badge {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 14px;
        color: #fff;
    }
    .game-badge svg { width: 18px; height: 18px; }

    .game-info { flex: 1; min-width: 0; }
    .game-name {
        font-size: 14.5px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .game-meta {
        font-size: 12px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .game-meta .dot {
        width: 3px; height: 3px; border-radius: 50%;
        background: var(--text-secondary); flex-shrink: 0;
    }

    .btn-outline {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        font-weight: 700;
        color: var(--primary);
        border: 1.5px solid var(--primary-light);
        background: #fff;
        padding: 7px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s ease;
    }
    .btn-outline:hover { background: var(--primary-light); }

    .load-more {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        width: 100%;
        margin-top: 14px;
        padding: 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--primary);
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
    }
    .load-more svg { width: 15px; height: 15px; transition: transform 0.15s ease; }
    .load-more.expanded svg { transform: rotate(180deg); }

    .empty-state {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 50px 24px;
        color: var(--text-secondary);
    }
    .empty-state.show { display: flex; }
    .empty-state svg { width: 46px; height: 46px; margin-bottom: 12px; color: #CBD5E1; }
    .empty-state p { font-size: 13.5px; }

    /* =================================================================
       BOTTOM NAVIGATION — identik dengan halaman lain
       ================================================================= */
    .bottom-nav-spacer { height: calc(72px + env(safe-area-inset-bottom)); }

    .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0 auto;
        width: 100%;
        max-width: 560px;
        display: flex;
        z-index: 50;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border);
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 2px;
        color: var(--text-secondary);
        border-radius: 12px;
        text-decoration: none;
        transition: color 0.15s ease;
    }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item span { font-size: 10.5px; font-weight: 600; letter-spacing: -0.01em; }
    .nav-item.active { color: var(--primary); }
    .nav-item:active { opacity: 0.7; }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text-secondary);
        margin: 14px 0 4px;
    }
    .back-link svg { width: 14px; height: 14px; }
    .back-link:active { opacity: 0.6; }
</style>
</head>

<div class="app-shell">

    <div class="app-header">
 <div class="brand">
  <div class="brand-mark">

<script src="data-games.js"></script>
<script>
    /* ================================================================
       HALAMAN INI HANYA MERENDER DATA — untuk MENAMBAH/MENGUBAH
       AKTIVITAS KELAS, edit array GAMES di file data-games.js.
       ================================================================ */
    const listEl = document.getElementById('gameList');
    const emptyEl = document.getElementById('emptyState');
    const emptyTextEl = emptyEl.querySelector('p');
    const searchInputEksternal = document.getElementById('searchEksternal');
    const searchBoxEksternal = document.getElementById('searchBoxEksternal');
    const clearSearchEksternal = document.getElementById('clearSearchEksternal');
    let queryEksternal = '';

    function cocokPencarian(game){
        if(!queryEksternal) return true;
        const gabungan = [
            game.nama,
            game.materi,
            game.deskripsi,
            ...(game.tags || [])
        ].join(' ').toLowerCase();
        return gabungan.includes(queryEksternal);
    }

    function renderGameList(){
        const data = GAMES.filter(g => cocokPencarian(g));
        listEl.innerHTML = '';

        if(data.length === 0){
            emptyTextEl.textContent = queryEksternal
                ? 'Aktivitas tidak ditemukan untuk kata kunci tersebut. Coba kata kunci lain.'
                : 'Belum ada aktivitas kelas untuk saat ini.';
            emptyEl.classList.add('show');
            return;
        }
        emptyEl.classList.remove('show');
        data.forEach(item => listEl.appendChild(buatBarisGame(item)));
    }

    searchInputEksternal.addEventListener('input', () => {
        queryEksternal = searchInputEksternal.value.trim().toLowerCase();
        searchBoxEksternal.classList.toggle('has-text', queryEksternal.length > 0);
        renderGameList();
    });
    clearSearchEksternal.addEventListener('click', () => {
        searchInputEksternal.value = '';
        queryEksternal = '';
        searchBoxEksternal.classList.remove('has-text');
        renderGameList();
        searchInputEksternal.focus();
    });

    renderGameList();
</script>
