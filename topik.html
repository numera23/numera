<!--
    =====================================================================
    NUMERA — topik.html
    =====================================================================
    Halaman ini adalah PUSAT NAVIGASI seluruh materi (bukan halaman materi).

    CARA MENAMBAH / MENGUBAH TOPIK
    -------------------------------
    Semua data topik ada pada satu array bernama TOPIK, di bagian
    <script> menjelang akhir file ini. Guru cukup mengubah array
    tersebut untuk:
      - menambah topik baru      -> tambahkan satu object baru di TOPIK
      - menghapus topik          -> hapus object-nya dari TOPIK
      - mengubah kategori        -> ubah properti "kategori" (filter chip
                                     akan otomatis menyesuaikan)
      - mengubah ikon            -> ubah properti "ikon" (emoji)
      - mengubah warna aksen     -> ubah properti "warna" (kode hex)
      - mengubah jumlah modul    -> ubah properti "jumlah"
      - mengubah nama modul      -> ubah isi array "modul"
      - mengubah link tujuan     -> ubah properti "link"

    TIDAK PERLU mengubah bagian HTML atau CSS sama sekali.
    Card, filter kategori, pencarian, jumlah topik, dan tampilan kosong
    akan otomatis menyesuaikan.
    =====================================================================
-->

<style>
    /* =================================================================
       RESET & DASAR
       ================================================================= */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #2563EB;
        --primary-hover: #1D4ED8;
        --bg: #F8FAFC;
        --card: #FFFFFF;
        --border: #E2E8F0;
        --text: #0F172A;
        --text-secondary: #64748B;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
    }

    /* =================================================================
       APP SHELL — canvas mobile
       Membatasi seluruh halaman ke lebar aplikasi HP. Di layar PC/
       laptop, konten tetap sempit dan berada di tengah, tidak melebar
       mengikuti lebar monitor. Ukuran ini sama dengan halaman Eksplorasi.
       ================================================================= */
    .app-shell {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
        position: relative;
    }

    @media (min-width: 561px) {
        .app-shell {
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
    }

    /* =================================================================
       HEADER / BRAND — konsisten dengan halaman Eksplorasi
       ================================================================= */
    .site-header {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        padding: 8px 20px;
        background: rgba(248, 250, 252, 0.86);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
    }

    .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 10px;
        background: linear-gradient(150deg, var(--primary), var(--primary-hover));
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.28);
    }

    .brand-name {
        font-weight: 800;
        font-size: 14px;
        line-height: 1.15;
        letter-spacing: -0.01em;
    }

    /* =================================================================
       KONTAINER UTAMA
       ================================================================= */
    .container {
        max-width: 880px;
        margin: 0 auto;
        padding: 12px 20px 20px;
    }

    /* =================================================================
       HEADING
       ================================================================= */
    .heading {
        text-align: center;
        margin-bottom: 10px;
        animation: fadeInUp 0.5s ease both;
    }

    .heading h1 {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 3px;
    }

    .heading p {
        font-size: 11.5px;
        color: var(--text-secondary);
    }

    .topik-count {
        font-size: 10.5px;
        color: var(--text-secondary);
        margin-top: 2px;
    }

    .topik-count strong {
        color: var(--primary);
        font-weight: 600;
    }

    /* =================================================================
       FILTER KATEGORI (CHIP)
       ================================================================= */
    .filter-wrap {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        max-width: 640px;
        margin: 0 auto 10px;
        animation: fadeInUp 0.5s ease 0.03s both;
    }

    .filter-chip {
        font-family: inherit;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-secondary);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .filter-chip:hover {
        border-color: var(--primary);
        color: var(--primary);
    }

    .filter-chip.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
    }

    /* =================================================================
       SEARCH
       ================================================================= */
    .search-wrap {
        position: relative;
        max-width: 520px;
        margin: 0 auto 14px;
        animation: fadeInUp 0.5s ease 0.06s both;
    }

    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 14px;
        opacity: 0.55;
        pointer-events: none;
    }

    #searchInput {
        width: 100%;
        padding: 9px 14px 9px 38px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        font-family: inherit;
        font-size: 13.5px;
        color: var(--text);
        outline: none;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #searchInput::placeholder {
        color: var(--text-secondary);
    }

    #searchInput:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    /* =================================================================
       GRID TOPIK
       ================================================================= */
    .topik-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 9px;
    }

    @media (min-width: 640px) {
        .topik-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* =================================================================
       CARD TOPIK
       ================================================================= */
    .topik-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 10px 14px;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        overflow: hidden;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        animation: fadeInUp 0.45s ease both;
    }

    /* garis aksen kiri, warna diambil dari data JS lewat --accent */
    .topik-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--accent, var(--primary));
    }

    .topik-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        border-color: var(--border);
    }

    .topik-card:active {
        transform: translateY(-1px);
    }

    .topik-icon {
        flex-shrink: 0;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        background: color-mix(in srgb, var(--accent, var(--primary)) 12%, white);
    }

    .topik-body {
        flex: 1;
        min-width: 0;
    }

    .topik-nama {
        font-size: 13.5px;
        font-weight: 600;
        margin-bottom: 3px;
        letter-spacing: -0.01em;
    }

    /* daftar modul ringkas (maks. 3 ditampilkan) */
    .topik-modul-list {
        list-style: none;
        margin: 0 0 2px;
        padding: 0;
    }

    .topik-modul-list li {
        position: relative;
        padding-left: 11px;
        font-size: 10.5px;
        color: var(--text-secondary);
        line-height: 1.35;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .topik-modul-list li::before {
        content: "•";
        position: absolute;
        left: 0;
        color: var(--accent, var(--primary));
        font-weight: 700;
    }

    .topik-lebih {
        font-size: 10px;
        color: var(--text-secondary);
        opacity: 0.85;
        margin-bottom: 4px;
    }

    .topik-badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 600;
        color: var(--accent, var(--primary));
        background: color-mix(in srgb, var(--accent, var(--primary)) 10%, white);
        padding: 2px 8px;
        border-radius: 999px;
    }

    .topik-arrow {
        flex-shrink: 0;
        font-size: 16px;
        color: var(--text-secondary);
        transition: transform 0.2s ease, color 0.2s ease;
    }

    .topik-card:hover .topik-arrow {
        transform: translateX(4px);
        color: var(--accent, var(--primary));
    }

    /* stagger sedikit animasi masuk untuk tiap card */
    .topik-card:nth-child(1) { animation-delay: 0.05s; }
    .topik-card:nth-child(2) { animation-delay: 0.09s; }
    .topik-card:nth-child(3) { animation-delay: 0.13s; }
    .topik-card:nth-child(4) { animation-delay: 0.17s; }
    .topik-card:nth-child(5) { animation-delay: 0.21s; }
    .topik-card:nth-child(6) { animation-delay: 0.25s; }
    .topik-card:nth-child(n+7) { animation-delay: 0.28s; }

    /* =================================================================
       EMPTY STATE (tidak ada hasil pencarian / filter)
       ================================================================= */
    .empty-state {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 40px 20px;
        color: var(--text-secondary);
        animation: fadeInUp 0.4s ease both;
    }

    .empty-state .empty-icon {
        font-size: 32px;
        margin-bottom: 10px;
        opacity: 0.6;
    }

    .empty-state p {
        font-size: 12.5px;
    }

    .empty-state.show {
        display: flex;
    }

    /* =================================================================
       FOOTER
       ================================================================= */
    footer {
        text-align: center;
        padding: 16px 20px 20px;
        font-size: 11.5px;
        color: var(--text-secondary);
        border-top: 1px solid var(--border);
    }

    /* =================================================================
       ANIMASI
       ================================================================= */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        * {
            animation: none !important;
            transition: none !important;
        }
    }

    /* =================================================================
       BOTTOM NAVIGATION
       Standar navigasi utama Numera : 5 menu, fixed di
       bawah, lebar mengikuti canvas mobile (tidak melebar di PC/laptop).
       ================================================================= */
    .bottom-nav-spacer {
        height: calc(72px + env(safe-area-inset-bottom));
    }

    .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0 auto;
        width: 100%;
        max-width: 560px;
        display: flex;
        z-index: 50;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border);
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 2px;
        color: var(--text-secondary);
        border-radius: 12px;
        text-decoration: none;
        transition: color 0.15s ease;
    }

    .nav-item svg {
        width: 22px;
        height: 22px;
    }

    .nav-item span {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
    }

    .nav-item.active {
        color: var(--primary);
    }

    .nav-item:active {
        opacity: 0.7;
    }
</style>
</head>

    <script>
        /* =============================================================
           DATA TOPIK
           -------------------------------------------------------------

        const grid = document.getElementById("topikGrid");
        const emptyState = document.getElementById("emptyState");
        const searchInput = document.getElementById("searchInput");
        const filterWrap = document.getElementById("filterWrap");
        const topikCountEl = document.getElementById("topikCount");

        /* state filter & pencarian yang aktif saat ini */
        let kategoriAktif = "Semua";

        /* =============================================================
           JUMLAH TOPIK (dihitung otomatis dari TOPIK)
           ============================================================= */
        function tampilkanJumlahTopik() {
            const total = TOPIK.length;
            topikCountEl.innerHTML = `Saat ini tersedia <strong>${total}</strong> topik pembelajaran.`;
        }

        /* =============================================================
           FILTER KATEGORI — dibuat otomatis dari TOPIK
           ============================================================= */
        function bangunFilterKategori() {
            // ambil kategori unik sesuai urutan kemunculan, lalu tambahkan "Semua" di depan
            const kategoriUnik = [...new Set(TOPIK.map(t => t.kategori))];
            const daftarChip = ["Semua", ...kategoriUnik];

            filterWrap.innerHTML = "";

            daftarChip.forEach(kategori => {
                const chip = document.createElement("button");
                chip.type = "button";
                chip.className = "filter-chip" + (kategori === kategoriAktif ? " active" : "");
                chip.textContent = kategori;
                chip.dataset.kategori = kategori;

                chip.addEventListener("click", () => {
                    kategoriAktif = kategori;
                    document.querySelectorAll(".filter-chip").forEach(el => {
                        el.classList.toggle("active", el.dataset.kategori === kategoriAktif);
                    });
                    terapkanFilter();
                });

                filterWrap.appendChild(chip);
            });
        }

        /* =============================================================
           RENDER CARD
           ============================================================= */
        function buatCard(topik) {
            const card = document.createElement("a");
            card.className = "topik-card";
            card.href = topik.link;
            card.style.setProperty("--accent", topik.warna);

            // maksimal 3 modul ditampilkan sebagai daftar ringkas
            const modulTampil = topik.modul.slice(0, 3);
            const sisaModul = topik.modul.length - modulTampil.length;

            const daftarModulHTML = modulTampil
                .map(m => `<li>${m}</li>`)
                .join("");

            const lebihHTML = sisaModul > 0
                ? `<div class="topik-lebih">+${sisaModul} modul lagi</div>`
                : "";

            card.innerHTML = `
                <div class="topik-icon">${topik.ikon}</div>
                <div class="topik-body">
                    <div class="topik-nama">${topik.nama}</div>
                    <ul class="topik-modul-list">${daftarModulHTML}</ul>
                    ${lebihHTML}
                    <span class="topik-badge">${topik.jumlah} Modul</span>
                </div>
                <div class="topik-arrow">›</div>
            `;

            return card;
        }

        function render(daftar) {
            grid.innerHTML = "";

            if (daftar.length === 0) {
                emptyState.classList.add("show");
                return;
            }

            emptyState.classList.remove("show");

            daftar.forEach(topik => {
                grid.appendChild(buatCard(topik));
            });
        }

        /* =============================================================
           PENCARIAN + FILTER KATEGORI (BEKERJA BERSAMAAN)
           Pencarian mencocokkan: nama topik, deskripsi, dan nama modul
           ============================================================= */
        function cariTopik(kata) {
            const kunci = kata.trim().toLowerCase();

            if (kunci === "") {
                return TOPIK;
            }

            return TOPIK.filter(topik => {
                const cocokNama = topik.nama.toLowerCase().includes(kunci);
                const cocokDeskripsi = topik.deskripsi.toLowerCase().includes(kunci);
                const cocokModul = topik.modul.some(m => m.toLowerCase().includes(kunci));

                return cocokNama || cocokDeskripsi || cocokModul;
            });
        }

        function terapkanFilter() {
            let hasil = cariTopik(searchInput.value);

            if (kategoriAktif !== "Semua") {
                hasil = hasil.filter(topik => topik.kategori === kategoriAktif);
            }

            render(hasil);
        }

        searchInput.addEventListener("input", terapkanFilter);

        /* =============================================================
           INISIALISASI
           ============================================================= */
        tampilkanJumlahTopik();
        bangunFilterKategori();
        terapkanFilter();
    </script>

</body>
</html>
